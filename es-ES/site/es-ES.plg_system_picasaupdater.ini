PLG_SYSTEM_PICASAUPDATER="Event Gallery - Actualizador de Google Photos y Flickr"
PLG_SYSTEM_PICASAUPDATER_XML_DESCRIPTION="Actualiza los álbumes vacíos de Google Photos/Flickr durante las peticiones a la parte pública. Los álbumes con imágenes no son un problema, ya que se actualizan automáticamente cuando se muestran. Los álbumes vacíos no son visibles en la parte pública y no pueden actualizarse automáticamente."
