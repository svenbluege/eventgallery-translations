PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT="Event Gallery - Informe de capacidades"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_XML_DESCRIPTION="Este plugin muestra las capacidades de Event Gallery en el informe de capacidades de Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_EXTENSION_NAME="Event Gallery"

PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_COOKIES="<b>Cookies:</b> No se establecen cookies adicionales. Para la gestión de sesiones, Event Gallery utiliza la gestión de sesiones de Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_GOOGLEPHOTOS="<b>Google Photos:</b> <p>Servir imágenes desde Google Photos hará que los usuarios carguen contenido desde los servidores de Google.</p><p>La gestión de Google Photos en la administración de Event Gallery también llamará a servicios de Google. Los datos de los usuarios de su administración se utilizarán para llamar a esos servicios, como el selector de álbumes.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_FLICKR="<b>Flickr:</b> Servir imágenes desde Flickr hará que los usuarios carguen datos desde un servicio externo. Además, su servidor se comunicará con los servicios de Flickr. Esta comunicación no implica datos de sus usuarios."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_S3="<b>S3:</b> Servir imágenes desde Amazon S3 hará que los usuarios carguen datos desde un servicio externo. Además, su servidor se comunicará con el servicio Amazon S3. Esta comunicación no implica datos de sus usuarios."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_CHECKOUT="<b>Finalizar compra</b><p>Antes de que un usuario pueda crear un pedido, reúne artículos en su carrito. Durante la finalización de la compra, este carrito se completa con los datos de dirección. Tras enviar el pedido, este se crea como copia del carrito. Además de la información de los artículos, se guardan los datos de dirección del cliente. La cantidad de datos depende de la configuración del componente.</p><p>Los datos de dirección se encuentran en tres lugares: el carrito, el pedido y el objeto de usuario de Joomla!. Aunque esto no puede cambiarse para el carrito y el pedido, puede configurar en las opciones del componente que no se use el objeto de usuario para almacenar datos.</p><p>Para algunos métodos de pago se utilizan servicios externos. Event Gallery no almacena datos de pago directos. En su lugar, se utiliza un token generado para identificar la transacción creada por el proveedor de pago externo.</p><p>La administración de Event Gallery permite vaciar los carritos con más de 30 días de antigüedad con un simple enlace.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_STRIPE="<b>Pago // Stripe:</b> Para iniciar un pago, Event Gallery envía a Stripe la dirección de correo electrónico, el número de pedido y el importe. El proceso de pago redirigirá a su cliente a una página alojada por Stripe, donde Stripe puede recopilar datos del usuario. No se carga nada de Stripe en su propio sitio web."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_PAYPAL="<b>Pago // PayPal:</b> Para crear una transacción de PayPal, Event Gallery debe transferir el ID del pedido a PayPal. El proceso de pago redirigirá a su cliente a PayPal, que podrá así recopilar datos del usuario."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_SHARING="<b>Compartir en redes sociales:</b> Event Gallery solo utiliza opciones de compartir pasivas. Es el usuario de la parte pública quien decide activar las opciones de compartir de los distintos servicios. No hay SDK de JavaScript que transmitan datos antes de cualquier interacción."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_YOUTUBE="<b>YouTube:</b> Para facilitar el inicio y ofrecer ayuda, la administración incrusta algunos vídeos de YouTube."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_LOGS="<b>Registros:</b> Event Gallery escribe algunos archivos de registro. Contienen la dirección IP del usuario del sitio web. Además de los registros de tareas de procesamiento, por ejemplo para Google Photos/Flickr/Amazon S3, escribe registros de las transacciones de pago. Encontrará esos archivos de registro en su carpeta de registros. Contienen datos de usuarios y deben tratarse con cuidado."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_MESSAGES="<b>Mensajes:</b> Los usuarios pueden denunciar imágenes o dejar mensajes sobre ellas. Pueden indicar una dirección de correo electrónico y un mensaje. Ambos se guardan en la base de datos."
