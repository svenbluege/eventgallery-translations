COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_AWS="Deje el endpoint vacío e introduzca la región de sus buckets. Los buckets nuevos no permiten ACL, así que publique las miniaturas con una política de bucket."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_CLOUDFLARE_R2="Sustituya <ACCOUNT_ID> por el ID de su cuenta de Cloudflare. R2 nunca sirve archivos públicos desde este endpoint: conecte un dominio propio (o la dirección r2.dev) al bucket de miniaturas e introdúzcalo como URL pública de las miniaturas. R2 solo puede publicar un bucket entero, así que use dos buckets, nunca uno."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_BACKBLAZE_B2="Introduzca la región de su bucket, por ejemplo eu-central-003. B2 solo puede publicar un bucket entero: cree el bucket de miniaturas como público y el de los originales como privado, y use dos buckets, nunca uno."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_WASABI="Introduzca la región de sus buckets. Wasabi no permite el acceso público en cuentas nuevas hasta que pida a su soporte que lo active."
