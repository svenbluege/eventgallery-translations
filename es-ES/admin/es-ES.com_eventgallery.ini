COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="Las páginas de Event Gallery muestran el carrito como una barra en la parte inferior de la ventana mientras contiene algo. Mientras el módulo del carrito está visible en una página, la barra se retira, de modo que el carrito aparece una sola vez. Desactive esta opción para mostrar el carrito solo en el módulo. Mantenga al menos uno de los dos: sin ninguno, añadir al carrito no funciona."
