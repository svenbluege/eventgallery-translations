COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_LABEL="Usar caché"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_DESCRIPTION="Consulte el manual sobre este parámetro. En resumen: activa la caché de algunos elementos, como consultas SQL y módulos, aunque la caché de Joomla! no esté activada."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_LABEL="Proteger archivos"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_DESCRIPTION="Si se establece en Sí, el sistema creará un archivo .htaccess para los archivos locales que impide el acceso directo a las imágenes subidas. Si desactiva esta opción de configuración, tendrá que eliminar usted mismo los archivos .htaccess existentes. No olvide la carpeta raíz de imágenes. Si activa esta opción, use después Sincronizar base de datos, que creará los archivos .htaccess. Tenga en cuenta que esto solo funciona en sistemas compatibles con archivos .htaccess."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_LABEL="Usar miniaturas precalculadas para imágenes locales"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_DESCRIPTION="No (predeterminado): Event Gallery entrega por sí mismo cada miniatura de una imagen local (image.php) y comprueba primero si el visitante puede ver la imagen. Sí: las miniaturas son archivos que entrega el servidor web; es más rápido, pero sin comprobación: cualquiera que tenga la dirección de una miniatura la obtiene, también en un evento con contraseña o con grupos de usuarios. Cree las miniaturas con el Thumbnail Creator; de lo contrario, su sitio no mostrará imágenes. Event Gallery escribe y elimina los archivos .htaccess y web.config de la carpeta images/eventgallery_generated según esta opción. Solo funcionan en un servidor web que los lea (Apache, LiteSpeed, IIS); en nginx, deniegue el acceso a la carpeta en la configuración del servidor."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FAILED="Event Gallery no ha podido actualizar la protección de acceso de la carpeta %s. Compruebe los permisos de archivo y elimine o restaure manualmente los archivos .htaccess y web.config de esa carpeta. De lo contrario, es posible que sus miniaturas no se entreguen correctamente."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FOREIGN="La carpeta %2$s contiene un archivo que no ha escrito Event Gallery: %1$s. Event Gallery lo deja como está. Compruebe si encaja con la opción «Usar miniaturas precalculadas para imágenes locales»: con la opción desactivada, el servidor web no debe entregar las miniaturas de esa carpeta; con ella activada, tiene que hacerlo. Si elimina el archivo, Event Gallery escribirá el suyo propio donde haga falta."

