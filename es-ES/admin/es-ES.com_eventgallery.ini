COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_DIGITALOCEAN="Introduzca la región de su Space, por ejemplo fra1. Spaces publica archivos individuales mediante ACL, por eso el interruptor de ACL está activado."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_SCALEWAY="Introduzca la región de sus buckets: fr-par, nl-ams o pl-waw."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_OVH="Introduzca la región de sus buckets en minúsculas, por ejemplo gra o de."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_N0C="Su sitio tiene que estar alojado en PlanetHoster: N0C Storage solo responde a sus servidores. Tome la región (por ejemplo ht2-storage) y las claves de Files - N0C Storage en su panel N0C. Solo la carpeta public del bucket es accesible desde la web, por eso las carpetas están configuradas para ello: introduzca https://your-domain/n0c-storage como URL pública de las miniaturas y suba sus imágenes a private/eventgallery/<folder>."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_SELFHOSTED="Sustituya <YOUR_HOST> por la dirección de su servicio, con el puerto si tiene uno. Los servicios autoalojados suelen necesitar direccionamiento por ruta y aceptan cualquier región."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_CUSTOM="Tome el endpoint y la región de la documentación de su proveedor. Si falla el inicio de sesión, pruebe el direccionamiento por ruta."
