COM_EVENTGALLERY_S3ACCOUNT_ORIGINALSPREFIX_DESCRIPTION="Opcional. La carpeta del bucket de originales que contiene las carpetas de sus eventos, por ejemplo private/eventgallery. Vacío: originals cuando originales y miniaturas comparten un bucket; si no, la raíz del bucket. Cambiarlo no mueve los archivos que ya están allí."
COM_EVENTGALLERY_S3ACCOUNT_THUMBNAILSPREFIX="Carpeta para miniaturas"
COM_EVENTGALLERY_S3ACCOUNT_THUMBNAILSPREFIX_DESCRIPTION="Opcional. La carpeta del bucket de miniaturas en la que Event Gallery las escribe, por ejemplo public/eventgallery. Vacío: resized cuando originales y miniaturas comparten un bucket; si no, la raíz del bucket. Cambiarlo no mueve las miniaturas que ya están allí; vuelva a crearlas."
