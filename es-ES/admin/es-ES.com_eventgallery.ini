COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_DESC="Si su sitio está en un alojamiento compartido, puede tener problemas con los retornos (callbacks) por https. Use esta opción de configuración para forzar el protocolo de las URL de retorno. Asegúrese de que sus reglas de reescritura no lo estropeen. La opción predeterminada es mantener, que usa el protocolo con el que el cliente visitó su sitio."
