COM_EVENTGALLERY_SYNC_INTRO="Pone la base de datos al día con los archivos de su almacenamiento: eventos nuevos, imágenes nuevas y modificadas. Los eventos nuevos se marcan automáticamente."
COM_EVENTGALLERY_SYNC_HOW="Cómo funciona la sincronización"
COM_EVENTGALLERY_SYNC_HOW_SCAN="La <b>fase 1</b> lee las carpetas de los eventos marcados y encuentra los archivos que la base de datos aún no conoce. Los archivos locales aparecen siempre; los archivos de S3, Flickr o Google Photos solo cuando el hash del original ha cambiado."
COM_EVENTGALLERY_SYNC_HOW_FILES="La <b>fase 2</b> lee esos archivos y escribe sus metadatos: tamaño, fecha, pie de foto. Es la más costosa: en S3 cada original se descarga completo para medirlo. Sin ella las imágenes aparecerían en la lista, pero sin sus dimensiones, y el sitio no podría maquetarlas."
COM_EVENTGALLERY_SYNC_HOW_S3="Un evento nuevo en S3 aún no tiene miniaturas: ejecute el Thumbnail Creator después de la sincronización."
COM_EVENTGALLERY_SYNC_START_BUTTON="Sincronizar eventos e imágenes"
COM_EVENTGALLERY_THUMBNAILGENERATOR_INTRO="Crea las miniaturas de los eventos de S3 y locales. No se marca nada automáticamente: crear miniaturas cuesta tiempo y solicitudes a S3."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW="Cómo funciona el Thumbnail Creator"
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_SCAN="La <b>fase 1</b> encuentra las miniaturas que faltan de los eventos marcados y la <b>fase 2</b> las crea. <i>Solo buscar miniaturas que faltan</i> se detiene tras la fase 1 y marca en amarillo cada evento en el que faltan miniaturas; el filtro <i>Faltan miniaturas</i> muestra solo esos eventos. Al final, la página indica lo que no ha podido hacer."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_COST="Tarda mucho, y cada miniatura es una solicitud a S3 que usted paga. Puede servir un bucket desde varios sitios, pero cree las miniaturas solo desde uno de ellos: la base de datos guarda los hashes de los originales y de las miniaturas, y donde faltan, las miniaturas se vuelven a crear."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_LOCAL="Para los eventos locales esta página es opcional: sus miniaturas se crean cuando un visitante las solicita por primera vez."
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_BUTTON="Buscar y crear miniaturas"
COM_EVENTGALLERY_THUMBNAILGENERATOR_REFRESHETAGS_LABEL="Conservar las miniaturas que ya existen en el bucket"
COM_EVENTGALLERY_CLEAR_CACHE_INTRO="Vacía las cachés que marque. Lo que se elimine se vuelve a crear cuando se necesite."
