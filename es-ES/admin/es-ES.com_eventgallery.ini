COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER="Aviso legal del pie de página"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER_DESCRIPTION="Introduzca aquí un aviso legal. Aparecerá en todas las páginas generadas por este componente si la función de carrito está activa."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS="Dirección"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS_DESCRIPTION="Su dirección comercial. Los correos a sus compradores terminan con ella, para que vean quién los envía."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_MAIL_OPTIONS_LABEL="<strong>Correos</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO="Logotipo"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO_DESCRIPTION="El logotipo en la parte superior de los correos a sus compradores. Use un archivo PNG o JPG: muchos programas de correo no muestran SVG. Sin logotipo se muestra el nombre de su sitio."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR="Color de acento"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR_DESCRIPTION="El color de los botones y enlaces en los correos a sus compradores."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYSYMBOL="Símbolo de moneda"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYSYMBOL_DESCRIPTION="Introduzca el símbolo de la moneda que desea usar. Puede ser tanto $ como USD"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE="Código de moneda"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE_DESCRIPTION="Introduzca el código de la moneda que desea usar. Tiene que ser algo como USD o EUR."

