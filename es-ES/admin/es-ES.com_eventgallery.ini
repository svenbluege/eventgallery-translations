COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_LABEL="Usar los datos de dirección del usuario"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_DESC="Define si se usan los datos de dirección guardados en el objeto de usuario. Si se establece en No, el usuario siempre tiene que introducir su dirección, aunque ya haya una dirección guardada en su cuenta."
COM_EVENTGALLERY_OPTIONS_COMMON_ENABLEBUSINESSCUSTOMERDATA_LABEL="Permitir clientes empresa"
COM_EVENTGALLERY_OPTIONS_COMMON_ENABLEBUSINESSCUSTOMERDATA_DESC="¿Mostrar un campo para el nombre de la empresa y el NIF/CIF a efectos de IVA?"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_IMAGE_OPTIONS_LABEL="<strong>Imágenes</strong>"
