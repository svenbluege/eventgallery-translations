COM_EVENTGALLERY_S3ACCOUNT_USEACL="Hacer públicas las miniaturas mediante ACL"
COM_EVENTGALLERY_S3ACCOUNT_USEACL_DESCRIPTION="Sí: cada miniatura se sube con la lista de control de acceso public-read. El bucket tiene que permitir ACL. No: Event Gallery no envía ninguna ACL y la política del bucket hace legibles las miniaturas. Elija No para proveedores sin ACL como Cloudflare R2 y Backblaze B2, y para buckets de Amazon S3 con la configuración predeterminada Bucket owner enforced."
COM_EVENTGALLERY_S3ACCOUNT_PUBLICBASEURL="URL pública de las miniaturas"
COM_EVENTGALLERY_S3ACCOUNT_PUBLICBASEURL_DESCRIPTION="Opcional. La dirección desde la que sus visitantes cargan las miniaturas, si no es el propio bucket: una CDN como CloudFront, un dominio propio o la URL pública del bucket de proveedores como Cloudflare R2."
