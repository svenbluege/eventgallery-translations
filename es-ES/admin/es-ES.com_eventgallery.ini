COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_DESCRIPTION="Déjelo activado: el navegador carga las miniaturas situadas por debajo de la primera fila solo cuando el visitante se desplaza cerca de ellas, lo que mantiene rápida una página larga. Desactívelo si quiere que todas las imágenes de una página se carguen a la vez, por ejemplo para una página que vaya a imprimir."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_LABEL="Usar marcas de agua en las imágenes principales"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_DESCRIPTION="Define si aparecen marcas de agua en las imágenes principales (las imágenes de un evento marcadas con la estrella)."

