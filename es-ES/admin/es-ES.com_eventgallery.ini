COM_EVENTGALLERY_PAYMENTMETHODS_HELP_1="El proveedor decide cómo cobra un método. Estándar es para pagos fuera de la tienda – efectivo al recoger, transferencia bancaria, contra reembolso – y funciona de inmediato. PayPal Checkout y Stripe requieren una cuenta allí; sus claves se introducen en el formulario del método."
