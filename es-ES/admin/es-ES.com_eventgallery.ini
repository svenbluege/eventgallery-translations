COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_TITLE_LABEL="Mostrar título de la imagen"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_TITLE_DESC="Muestra el título de la imagen en el carrito, al finalizar la compra y en las páginas de mis pedidos."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_LABEL="Mostrar pie de foto de la imagen"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_DESC="Muestra el pie de foto de la imagen en el carrito, al finalizar la compra y en las páginas de mis pedidos."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_NAME_LABEL="Mostrar nombre de archivo"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_NAME_DESC="Puede ocultar el nombre de archivo en las páginas de finalizar compra y de pedidos. Tiene sentido para Google Photos y Flickr, que usan letras y números aleatorios que apenas ayudan al cliente a identificar una imagen."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_DISCLAIMER="Aviso legal"
