COM_EVENTGALLERY_S3ACCOUNT_ENDPOINT_DESCRIPTION="El nombre de host de la API S3 de su proveedor, sin el nombre del bucket, por ejemplo s3.eu-central-1.wasabisys.com. Déjelo vacío para Amazon S3."
