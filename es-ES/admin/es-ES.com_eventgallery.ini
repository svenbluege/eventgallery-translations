COM_EVENTGALLERY_S3ACCOUNT_PATHSTYLE_DESCRIPTION="No: el bucket forma parte del nombre de host (https://bucket.endpoint/file). Sí: el bucket forma parte de la ruta (https://endpoint/bucket/file). La mayoría de los proveedores alojados funcionan con No; los servicios autoalojados suelen necesitar Sí."
