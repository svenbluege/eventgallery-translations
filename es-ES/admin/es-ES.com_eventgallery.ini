COM_EVENTGALLERY_S3ACCOUNT_PUBLICBASEURLPREFIX_DESCRIPTION="Opcional. Solo si la URL pública anterior muestra una carpeta del bucket en lugar del bucket entero: el nombre de esa carpeta. N0C Storage, por ejemplo, muestra la carpeta public bajo https://your-domain/n0c-storage. La carpeta para miniaturas tiene que estar dentro de ella."
