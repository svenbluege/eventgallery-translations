COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_DESCRIPTION="Define si se usan las imágenes originales, archivos de baja resolución o ambos para la descarga y las redes sociales. Los archivos de baja resolución pueden contener una marca de agua."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LOWRES="Baja resolución"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_ORIGINAL="Archivos originales"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_BOTH="Ambos"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_LABEL="Acceso a archivos originales"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_DESCRIPTION="El grupo de usuarios seleccionado puede descargar los archivos originales."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_OVERRIDE_DESCRIPTION="El grupo de usuarios seleccionado puede descargar los archivos originales. Si solo se selecciona el predeterminado, se usan los grupos de usuarios de la configuración del componente. En caso contrario, la configuración del evento sustituye por completo la del grupo de usuarios del componente."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_LABEL="URL de redirección"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_DESCRIPTION="Si la descarga no está permitida para el usuario actual, se le redirige a esta URL. Puede indicar aquí la URL de su página de suscripción."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_LABEL="Denuncia de imágenes"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_DESCRIPTION="Permite que la gente denuncie imágenes. Puede usar esta función para recoger notas de sus clientes o reclamaciones de personas que quieren que se elimine su imagen."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_LABEL="Usar entrega alternativa"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_DESC="Alternativa que usa index.php para entregar las imágenes. Es lenta y no debería ser su solución a largo plazo. Contacte con su proveedor para asegurarse de que se pueden ejecutar scripts PHP en las carpetas de componentes, al menos para components/com_eventgallery/helpers/image.php y blank.php."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_LABEL="Usar enfoque"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_DESCRIPTION="Activa o desactiva el enfoque en general. Si está activado, usa la matriz definida más abajo."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_LABEL="Enfocar original"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_DESCRIPTION="Si la imagen se entrega al navegador con el mismo tamaño que el archivo subido, puede desactivar aquí el enfoque. De forma predeterminada, este ajuste afecta a las imágenes subidas con menos de 1600px. Para el resto de imágenes se entregan miniaturas más pequeñas y este ajuste no se aplica."
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_LABEL="Usar rotación automática"
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_DESCRIPTION="Gira las imágenes según el indicador de rotación que forma parte de la información EXIF guardada con cada imagen. No olvide vaciar la caché y sincronizar la base de datos si cambia esta opción."
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_LABEL="Sobrescribir con datos IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_DESCRIPTION="Si se establece en Sí, los campos de fecha de creación, pie de foto y título de una imagen en la base de datos se sobrescriben con los datos IPTC del archivo de imagen. En caso contrario, los datos IPTC solo se usan para rellenar los campos inicialmente."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_LABEL="Usar datos IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_DESCRIPTION="Use esta opción para activar o desactivar el uso de datos IPTC para obtener datos como la descripción y el título de la imagen."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_LABEL="Calidad de imagen"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_DESC="La calidad de cada imagen generada, de 40 a 95. El valor predeterminado 85 es bueno; los valores más bajos dan archivos más pequeños y menor calidad."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_LABEL="Bust"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_DESC="Las imágenes se guardan en la caché de los navegadores y la gente no vería sus cambios. El valor de este parámetro se añade a las URL de las imágenes locales y de S3. Esto ayuda a forzar a los navegadores a recargar las imágenes si las ha cambiado."
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_LABEL="Matriz de enfoque"
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_DESCRIPTION="¡No toque esto si no sabe lo que está haciendo! El valor predeterminado es [[-1,-1,-1],[-1,16,-1],[-1,-1,-1]]. Permite definir la nitidez de las imágenes calculadas. Si cambia este valor, tiene que vaciar la caché de este componente para ver el resultado. ¿Cómo configurar la matriz? https://www.php.net/imageconvolution"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_LABEL="Mostrar nombre de archivo"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_DESCRIPTION="Define si se muestra el nombre de archivo de la imagen actual para que los posibles clientes lo conozcan."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_LABEL="Mostrar título de la imagen"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_DESCRIPTION="Muestra el título de la imagen."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_LABEL="Mostrar pie de foto de la imagen"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_DESCRIPTION="Muestra la descripción de una imagen."
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_LABEL="Mezclar imágenes"
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_DESCRIPTION="Si se establece en Sí, las imágenes de un evento se muestran en orden aleatorio. Solo funciona si no hay paginación activa y afecta únicamente al componente."
