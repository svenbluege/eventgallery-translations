COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_PINTEREST_LABEL="Pinterest"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_PINTEREST_DESCRIPTION="Activa el botón para compartir en Pinterest."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_LABEL="Correo electrónico"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_DESCRIPTION="Activa el botón para compartir por correo electrónico."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_LABEL="Enviar imagen por correo electrónico"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_DESCRIPTION="Activa un botón de compartir que envía la propia imagen incrustada en un correo electrónico en lugar de un enlace. Usa el mismo tamaño de imagen que la descarga: la imagen original o la miniatura más grande."
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_LABEL="Tamaño máximo de imagen para correos (MB)"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_DESCRIPTION="Las imágenes mayores que este tamaño se envían como la miniatura más grande en lugar de la imagen original. Si la miniatura sigue siendo demasiado grande, se pide al visitante que use la descarga."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_LABEL="Descargar imágenes"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_DESCRIPTION="Activa el botón de descarga de imágenes."
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_LABEL="Compartir enlaces de artículos"
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_DESCRIPTION="Si una imagen se muestra dentro de un artículo, puede configurar qué enlace se comparte."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_LABEL="Botón de descarga propio"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_DESCRIPTION="Muestra el botón de descarga junto al icono de compartir en la miniatura"
