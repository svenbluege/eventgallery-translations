COM_EVENTGALLERY_SHIPPINGMETHODS_INTRO="Cada encomenda precisa de um método de envio que se adeque ao seu conteúdo. A finalização da compra oferece os métodos publicados que se adequam ao carrinho e pré-seleciona o predefinido; sem predefinição, o primeiro publicado. A ordem desta lista é a ordem na finalização da compra."
COM_EVENTGALLERY_SHIPPINGMETHODS_HELP_TITLE="Como funcionam os métodos de envio"
COM_EVENTGALLERY_SHIPPINGMETHODS_HELP_1="O fornecedor decide o que um método entrega: Standard Ground envia impressões, Download e Email entregam transferências e Mixed adequa-se aos carrinhos que escolher no respetivo formulário."
COM_EVENTGALLERY_SHIPPINGMETHODS_HELP_2="Um método que pede uma morada obriga os compradores a introduzir a morada postal na finalização da compra; caso contrário, bastam o nome e o e-mail."
