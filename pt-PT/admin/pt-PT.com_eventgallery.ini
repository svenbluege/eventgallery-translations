COM_EVENTGALLERY_SUBMENU_THUMBNAILGENERATOR="Gerador de miniaturas"
COM_EVENTGALLERY_THUMBNAILGENERATOR_START2_DESC="Esta página mostra os seus eventos S3 e locais. Cada imagem no bucket dos originais precisa das suas miniaturas.<br><br>Assinale os eventos em que pretende trabalhar - nada vem assinalado, porque esta operação é dispendiosa - e prima <b>Iniciar</b>. A página começa por procurar as miniaturas em falta e depois cria-as; o segundo botão apenas procura. No fim, indica o que não conseguiu fazer.<br><br><b>Isto demora muito tempo</b>, e cada miniatura é uma operação POST pela qual paga. Pode servir um bucket S3 a partir de vários sítios, mas crie as miniaturas apenas a partir de um deles: a base de dados guarda as somas de verificação dos originais e das miniaturas e, onde faltarem, as miniaturas são criadas de novo. Para os eventos locais, esta página é opcional - as respetivas miniaturas são criadas a pedido."
