COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_LABEL="Mostrar o carrinho do componente"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="Se utilizar um módulo para apresentar o carrinho, tem de definir esta opção de configuração como Não. Caso contrário, o carrinho aparece duas vezes e ocorrem erros."
