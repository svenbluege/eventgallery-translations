COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_SELECTION="Apenas seleção (várias imagens de uma vez)"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOW_CART_CONNECTOR_LABEL="Mostrar ligação ao carrinho externo"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOW_CART_CONNECTOR_DESCRIPTION="Define se é mostrada a ligação adicional ao carrinho, que pode definir abaixo."
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_REL_LABEL="Atributo rel da ligação ao carrinho externo"
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_REL_DESCRIPTION="Define a relação (rel) da ligação ao carrinho externo. A predefinição é nofollow, para impedir que os motores de pesquisa sigam a ligação."
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_LABEL="Ligação ao carrinho externo"
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_DESCRIPTION="Define um padrão para uma ligação externa. Pode utilizar os seguintes marcadores: {folder}, {file}, {fileBase}, {categoryId}, {categorySlug} e {categoryTitle}, por exemplo: http://www.foo.bar?category={folder}&amp;sku={fileBase}"
