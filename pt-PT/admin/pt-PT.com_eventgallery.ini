COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_SINGLE="Apenas botão do carrinho (uma imagem de cada vez)"
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_SELECTION="Apenas seleção (várias imagens de uma vez)"
