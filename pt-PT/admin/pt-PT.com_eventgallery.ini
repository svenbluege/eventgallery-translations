COM_EVENTGALLERY_OPTIONS_EVENTACCESS_INSTRUCTIONS_LABEL="Instruções"
COM_EVENTGALLERY_OPTIONS_EVENTACCESS_INSTRUCTIONS_DESC="Este texto aparece acima do campo da palavra-passe. Utilize-o para indicar aos seus clientes onde receberam a palavra-passe ou a quem a devem pedir. Deixe vazio para mostrar a frase predefinida."
COM_EVENTGALLERY_OPTIONS_EVENTS_MAX_EVENTS_PER_PAGE_LABEL="Máximo de eventos por página"
COM_EVENTGALLERY_OPTIONS_EVENTS_MAX_EVENTS_PER_PAGE_DESC="Define o número máximo de eventos por página."
COM_EVENTGALLERY_OPTIONS_EVENTS_MAX_IMAGES_PER_PAGE_LABEL="Máximo de imagens por página"
COM_EVENTGALLERY_OPTIONS_EVENTS_MAX_IMAGES_PER_PAGE_DESC="Define o número máximo de imagens por página."

COM_EVENTGALLERY_OPTIONS_CATEGORIES_CATEGORY_LABEL="Categoria"
COM_EVENTGALLERY_OPTIONS_CATEGORIES_CATEGORY_DESC="A categoria predefinida deste item de menu."


COM_EVENTGALLERY_OPTIONS_EVENT_AJAX_MAX_HEIGHT_LABEL="Altura máxima da área de miniaturas"
COM_EVENTGALLERY_OPTIONS_EVENT_AJAX_MAX_HEIGHT_DESC="A altura máxima, em px, que uma página de miniaturas pode ocupar. As miniaturas são distribuídas pelo número de páginas necessário para não ultrapassar essa altura, pelo que um ecrã estreito tem simplesmente mais páginas em vez de mais linhas. O texto de introdução na primeira página conta para esta altura."
COM_EVENTGALLERY_OPTIONS_EVENT_AJAX_THUMBNAIL_SIZE_LABEL="Tamanho das miniaturas"
COM_EVENTGALLERY_OPTIONS_EVENT_AJAX_THUMBNAIL_SIZE_DESC="Define o tamanho, em px, das miniaturas na lista Ajax."
COM_EVENTGALLERY_OPTIONS_EVENT_AJAX_SHOW_INFO_INLINE_LABEL="Mostrar informação em linha"
COM_EVENTGALLERY_OPTIONS_EVENT_AJAX_SHOW_INFO_INLINE_DESC="Define como mostrar o nome e a descrição do evento. As posições possíveis são acima das miniaturas ou em linha, na primeira página de miniaturas."


COM_EVENTGALLERY_OPTIONS_EVENT_USE_PAGING_LABEL="Utilizar paginação"
COM_EVENTGALLERY_OPTIONS_EVENT_USE_PAGING_DESC="Mostra ou oculta a barra de paginação das imagens de um evento."

COM_EVENTGALLERY_LAYOUT_EVENT_FIELDSET_LABEL="Esquema do evento"
COM_EVENTGALLERY_LAYOUT_EVENT_FOLDER_LABEL="Selecionar evento"
COM_EVENTGALLERY_LAYOUT_EVENT_FOLDER_DESC="Selecione o evento que pretende apresentar"

COM_EVENTGALLERY_OPTIONS_EVENTS_SPACER_LAYOUT="<b>Opções de esquema</b>"
COM_EVENTGALLERY_OPTIONS_EVENTS_SPACER_NAVIGATION="<strong>Opções de navegação</strong>"
COM_EVENTGALLERY_OPTIONS_EVENTS_SPACER_CONTENT="<strong>Opções de conteúdo</strong>"
COM_EVENTGALLERY_OPTIONS_EVENT_THUMBNAIL_HEIGHT_LABEL="Altura de uma miniatura"
COM_EVENTGALLERY_OPTIONS_EVENT_THUMBNAIL_HEIGHT_DESC="A altura de uma linha de miniaturas em px. As linhas preenchem a largura com imagens inteiras, por isso uma linha fica um pouco mais baixa ou mais alta; num ecrã estreito, uma linha tem no máximo 30 % da largura de altura."
