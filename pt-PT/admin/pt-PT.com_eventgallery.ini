COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDMESSAGE_MANDATORY_DESC="Torna obrigatório o campo de introdução da mensagem."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_PRESELECTED_COUNTRY_LABEL="Pré-seleção do país"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_PRESELECTED_COUNTRY_DESC="Define o país selecionado por predefinição na lista pendente de países durante a finalização da compra. Utilize aqui o código de país de dois caracteres. Exemplo: DE, US, GB. Só pode introduzir um valor."
COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_LABEL="Utilizar formulário de início de sessão"
COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_DESC="Pode mostrar um formulário de início de sessão na página da morada, durante a finalização da compra, para que os utilizadores possam iniciar sessão e associar a encomenda à sua conta."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_LABEL="Utilizar os dados de morada do utilizador"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_DESC="Define se são utilizados os dados de morada guardados no utilizador. Se definido como Não, o utilizador tem sempre de introduzir a sua morada, mesmo que já exista uma morada guardada na sua conta."
COM_EVENTGALLERY_OPTIONS_COMMON_ENABLEBUSINESSCUSTOMERDATA_LABEL="Permitir clientes empresariais"
COM_EVENTGALLERY_OPTIONS_COMMON_ENABLEBUSINESSCUSTOMERDATA_DESC="Mostrar um campo para o nome da empresa e o número de IVA?"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_IMAGE_OPTIONS_LABEL="<strong>Imagens</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_LEGAL_OPTIONS_LABEL="<strong>Aspetos legais</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_TITLE_LABEL="Mostrar título da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_TITLE_DESC="Mostra o título da imagem no carrinho, na finalização da compra e nas páginas das minhas encomendas."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_LABEL="Mostrar legenda da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_DESC="Mostra a legenda da imagem no carrinho, na finalização da compra e nas páginas das minhas encomendas."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_NAME_LABEL="Mostrar nome do ficheiro"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_NAME_DESC="Pode ocultar o nome do ficheiro nas páginas de finalização da compra e de encomendas. Faz sentido para o Google Photos e o Flickr, que utilizam caracteres e números aleatórios que pouco ajudam o cliente a identificar uma imagem."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_DISCLAIMER="Aviso legal"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_DISCLAIMER_DESCRIPTION="Introduza aqui o aviso legal."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER="Aviso legal do rodapé"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER_DESCRIPTION="Introduza aqui um aviso legal. Aparecerá em todas as páginas apresentadas por este componente se a funcionalidade de carrinho estiver ativa."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS="Morada"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS_DESCRIPTION="A sua morada de comerciante. Os e-mails enviados aos seus compradores terminam com ela, para que possam ver quem os enviou."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_MAIL_OPTIONS_LABEL="<strong>E-mails</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO="Logótipo"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO_DESCRIPTION="O logótipo no topo dos e-mails enviados aos seus compradores. Utilize um ficheiro PNG ou JPG: muitos programas de e-mail não mostram SVG. Sem logótipo, é mostrado o nome do seu sítio."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR="Cor de destaque"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR_DESCRIPTION="A cor dos botões e das ligações nos e-mails enviados aos seus compradores."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYSYMBOL="Símbolo da moeda"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYSYMBOL_DESCRIPTION="Introduza o símbolo da moeda que pretende utilizar. Pode ser tanto $ como USD"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE="Código da moeda"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE_DESCRIPTION="Introduza o código da moeda que pretende utilizar. Tem de ser algo como USD ou EUR."

COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_LABEL="Protocolo de callback"
COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_DESC="Se o sítio estiver num alojamento partilhado, poderá ter problemas com callbacks por https. Utilize esta opção de configuração para forçar o protocolo dos URL de callback. Certifique-se de que as suas regras de reescrita não interferem com isto. A opção predefinida é manter, que utiliza o protocolo com que o cliente visitou o seu sítio."
COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_SECURE_LABEL="https"
COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_INSECURE_LABEL="http"
COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_KEEP_LABEL="manter"

COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_PRIVACYPOLICYARTICLELINK="Política de privacidade"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_PRIVACYPOLICYARTICLELINK_DESCRIPTION="Ligação para o artigo da política de privacidade. Se este campo estiver vazio, a ligação não aparece"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_TACARTICLELINK="Termos e condições"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_TACARTICLELINK_DESCRIPTION="Ligação para o artigo dos termos e condições. Se este campo estiver vazio, a ligação não aparece"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_IMPRESSARTICLELINK="Informações legais"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_IMPRESSARTICLELINK_DESCRIPTION="Ligação para o artigo das informações legais. Se este campo estiver vazio, a ligação não aparece"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_NEWSLETTER_OPTIN="Adesão à newsletter"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_NEWSLETTER_OPTIN_DESCRIPTION="Mostra, na página de finalização da compra, uma opção de adesão para subscrever uma newsletter ou algo semelhante."

COM_EVENTGALLERY_EVENTS_OPTIONS_SOCIAL_LABEL="Redes sociais"
COM_EVENTGALLERY_EVENTS_OPTIONS_SOCIAL_DESC="Opções de partilha nas redes sociais"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_BUTTON_LABEL="Mostrar botão de partilha nas redes sociais"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_BUTTON_DESCRIPTION="Define se é mostrada a opção de partilhar imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_LINK_TYPE_LABEL="Tipo de ligação"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_LINK_TYPE_DESCRIPTION="Define o tipo de ligação partilhada quando alguém partilha uma imagem. O ideal é utilizar a Página da imagem, para garantir que a imagem certa aparece com esta ação. Pode fazer com que o utilizador seja redirecionado para a página do evento escolhendo a opção correspondente."
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_LINK_TYPE_SINGLEIMAGE_TO_EVENT_LABEL="Página da imagem com redirecionamento"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_LINK_TYPE_SINGLEIMAGE_LABEL="Página da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_LINK_TYPE_EVENT_LABEL="Página do evento"


COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_FACEBOOK_LABEL="Facebook"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_FACEBOOK_DESCRIPTION="Ativa o botão de partilha para o Facebook."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_TWITTER_LABEL="X"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_TWITTER_DESCRIPTION="Ativa o botão de partilha para o X."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_LINKEDIN_LABEL="LinkedIn"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_LINKEDIN_DESCRIPTION="Ativa o botão de partilha para o LinkedIn."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_PINTEREST_LABEL="Pinterest"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_PINTEREST_DESCRIPTION="Ativa o botão de partilha para o Pinterest."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_LABEL="E-mail"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_DESCRIPTION="Ativa o botão de partilha por e-mail."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_LABEL="Enviar imagem por e-mail"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_DESCRIPTION="Ativa um botão de partilha que envia a própria imagem incorporada num e-mail, em vez de uma ligação. Utiliza o mesmo tamanho de imagem que a transferência: a imagem original ou a maior miniatura."
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_LABEL="Tamanho máximo da imagem para e-mails (MB)"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_DESCRIPTION="As imagens maiores do que este tamanho são enviadas como a maior miniatura em vez da imagem original. Se a miniatura ainda for demasiado grande, pede-se ao visitante que utilize a transferência."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_LABEL="Transferir imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_DESCRIPTION="Ativa o botão de transferência de imagens."
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_LABEL="Partilhar ligações de artigos"
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_DESCRIPTION="Se uma imagem for mostrada dentro de um artigo, pode configurar qual a ligação que é partilhada."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_LABEL="Botão de transferência dedicado"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_DESCRIPTION="Mostra o botão de transferência junto ao ícone de partilha na miniatura"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_SPACER_LABEL="<strong>Opções de transferência</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LABEL="Utilizar ficheiros originais"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_DESCRIPTION="Define se são utilizadas as imagens originais, os ficheiros de baixa resolução ou ambos para a transferência e as redes sociais. Os ficheiros de baixa resolução podem conter uma marca de água."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LOWRES="Baixa resolução"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_ORIGINAL="Ficheiros originais"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_BOTH="Ambos"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_LABEL="Acesso aos ficheiros originais"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_DESCRIPTION="O grupo de utilizadores selecionado pode transferir os ficheiros originais."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_OVERRIDE_DESCRIPTION="O grupo de utilizadores selecionado pode transferir os ficheiros originais. Se apenas estiver selecionada a predefinição, são utilizados os grupos de utilizadores da configuração do componente. Caso contrário, as definições do evento substituem por completo a definição de grupos de utilizadores do componente."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_LABEL="URL de redirecionamento"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_DESCRIPTION="Se a transferência não for permitida ao utilizador atual, este é redirecionado para este URL. Pode indicar aqui o URL da sua página de subscrição."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_LABEL="Denúncia de imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_DESCRIPTION="Permite que as pessoas denunciem imagens. Pode utilizar esta funcionalidade para recolher notas dos seus clientes ou reclamações, caso alguém pretenda que a sua imagem seja eliminada."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_LABEL="Utilizar renderização alternativa"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_DESC="Solução alternativa que utiliza o index.php para a entrega de imagens. É lenta e não deve ser a sua solução a longo prazo. Contacte o seu fornecedor de alojamento para garantir que os scripts php podem ser executados nas pastas dos componentes. No mínimo, isso seria importante para components/com_eventgallery/helpers/image.php e blank.php."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_LABEL="Utilizar nitidez"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_DESCRIPTION="Ativa ou desativa o aumento de nitidez em geral. Se ativado, utiliza a matriz definida abaixo."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_LABEL="Aplicar nitidez ao original"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_DESCRIPTION="Se a imagem for entregue ao navegador no mesmo tamanho do ficheiro carregado, pode desativar aqui o aumento de nitidez. Por predefinição, as imagens carregadas com menos de 1600px são afetadas por esta definição. Para todas as outras imagens são entregues miniaturas mais pequenas e esta definição não se aplica."
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_LABEL="Utilizar rotação automática"
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_DESCRIPTION="Roda as imagens com base no indicador de rotação que faz parte da informação EXIF guardada em cada imagem. Não se esqueça de limpar a cache e sincronizar a base de dados se alterar esta opção."
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_LABEL="Substituir por dados IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_DESCRIPTION="Se definido como Sim, os campos de data de criação, legenda e título de uma imagem na base de dados são substituídos pelos dados IPTC do ficheiro de imagem. Caso contrário, os dados IPTC são utilizados apenas para preencher os campos inicialmente."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_LABEL="Utilizar dados IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_DESCRIPTION="Utilize esta opção para ativar ou desativar a utilização de dados IPTC para obter dados como a descrição e o título da imagem."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_LABEL="Qualidade da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_DESC="A qualidade de todas as imagens geradas, de 40 a 95. O valor predefinido de 85 é bom; valores mais baixos dão ficheiros mais pequenos e menor qualidade."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_LABEL="Parâmetro anticache"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_DESC="As imagens ficam em cache nos navegadores e as pessoas não veriam as suas atualizações. O valor deste parâmetro é adicionado aos URL das imagens locais e do S3. Isto ajuda a forçar os navegadores a recarregar as imagens caso as tenha alterado."
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_LABEL="Matriz de nitidez"
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_DESCRIPTION="Não altere isto se não souber o que está a fazer! A predefinição é [[-1,-1,-1],[-1,16,-1],[-1,-1,-1]]. Permite definir a nitidez das imagens calculadas. Se alterar este valor, tem de limpar a cache deste componente para ver o resultado. Como definir a matriz? https://www.php.net/imageconvolution"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_LABEL="Mostrar nome do ficheiro"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_DESCRIPTION="Define se é mostrado o nome do ficheiro da imagem atual, para que os potenciais clientes o fiquem a conhecer."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_LABEL="Mostrar título da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_DESCRIPTION="Mostra o título da imagem."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_LABEL="Mostrar legenda da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_DESCRIPTION="Mostra a descrição de uma imagem."
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_LABEL="Baralhar imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_DESCRIPTION="Se definido como Sim, as imagens de um evento são apresentadas por ordem aleatória. Só funciona se não houver paginação ativa e afeta apenas o componente."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_LABEL="Utilizar carregamento diferido"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_DESCRIPTION="Mantenha esta opção ativada: o navegador só carrega as miniaturas abaixo da primeira linha quando o visitante se aproxima delas ao deslocar a página, o que mantém rápida uma página longa. Desative-a se pretender que todas as imagens de uma página sejam carregadas de uma vez, por exemplo numa página que vai imprimir."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_LABEL="Utilizar marcas de água nas imagens principais"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_DESCRIPTION="Define se as marcas de água aparecem nas imagens principais (as imagens de um evento marcadas com a estrela)."

COM_EVENTGALLERY_OPTIONS_LAYOUT_EVENT="Evento - Geral"
COM_EVENTGALLERY_OPTIONS_LAYOUT_EVENT_DESC="Configure as opções utilizadas em todos os esquemas de evento"

COM_EVENTGALLERY_OPTIONS_LAYOUT_EVENTS_LIST="Eventos - Lista"
COM_EVENTGALLERY_OPTIONS_LAYOUT_EVENTS_LIST_DESC="Configure a lista de eventos."
COM_EVENTGALLERY_OPTIONS_LAYOUT_EVENTS_LIST_MESSAGE="Esta é a lista habitual de eventos, com miniaturas e outros elementos."
COM_EVENTGALLERY_OPTIONS_EVENT_LAYOUT_LABEL="Esquema do evento"
COM_EVENTGALLERY_OPTIONS_EVENT_LAYOUT_DESC="Define o esquema da vista de evento."
