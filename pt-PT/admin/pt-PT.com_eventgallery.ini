COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_LABEL="E-mail"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_DESCRIPTION="Ativa o botão de partilha por e-mail."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_LABEL="Enviar imagem por e-mail"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_DESCRIPTION="Ativa um botão de partilha que envia a própria imagem incorporada num e-mail, em vez de uma ligação. Utiliza o mesmo tamanho de imagem que a transferência: a imagem original ou a maior miniatura."
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_LABEL="Tamanho máximo da imagem para e-mails (MB)"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_DESCRIPTION="As imagens maiores do que este tamanho são enviadas como a maior miniatura em vez da imagem original. Se a miniatura ainda for demasiado grande, pede-se ao visitante que utilize a transferência."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_LABEL="Transferir imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_DESCRIPTION="Ativa o botão de transferência de imagens."
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_LABEL="Partilhar ligações de artigos"
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_DESCRIPTION="Se uma imagem for mostrada dentro de um artigo, pode configurar qual a ligação que é partilhada."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_LABEL="Botão de transferência dedicado"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_DESCRIPTION="Mostra o botão de transferência junto ao ícone de partilha na miniatura"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_SPACER_LABEL="<strong>Opções de transferência</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LABEL="Utilizar ficheiros originais"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_DESCRIPTION="Define se são utilizadas as imagens originais, os ficheiros de baixa resolução ou ambos para a transferência e as redes sociais. Os ficheiros de baixa resolução podem conter uma marca de água. Só funciona com imagens locais e do Amazon S3."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LOWRES="Baixa resolução"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_ORIGINAL="Ficheiros originais"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_BOTH="Ambos"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_LABEL="Acesso aos ficheiros originais"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_DESCRIPTION="O grupo de utilizadores selecionado pode transferir os ficheiros originais."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_OVERRIDE_DESCRIPTION="O grupo de utilizadores selecionado pode transferir os ficheiros originais. Se apenas estiver selecionada a predefinição, são utilizados os grupos de utilizadores da configuração do componente. Caso contrário, as definições do evento substituem por completo a definição de grupos de utilizadores do componente."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_LABEL="URL de redirecionamento"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_DESCRIPTION="Se a transferência não for permitida ao utilizador atual, este é redirecionado para este URL. Pode indicar aqui o URL da sua página de subscrição."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_LABEL="Denúncia de imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_DESCRIPTION="Permite que as pessoas denunciem imagens. Pode utilizar esta funcionalidade para recolher notas dos seus clientes ou reclamações, caso alguém pretenda que a sua imagem seja eliminada."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_LABEL="Utilizar renderização alternativa"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_DESC="Solução alternativa que utiliza o index.php para a entrega de imagens. É lenta e não deve ser a sua solução a longo prazo. Contacte o seu fornecedor de alojamento para garantir que os scripts php podem ser executados nas pastas dos componentes. No mínimo, isso seria importante para components/com_eventgallery/helpers/image.php e blank.php."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_LABEL="Utilizar nitidez"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_DESCRIPTION="Ativa ou desativa por completo o aumento de nitidez. Se ativado, utiliza a matriz definida abaixo."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_LABEL="Aplicar nitidez ao original"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_DESCRIPTION="Se a imagem for entregue ao navegador no mesmo tamanho do ficheiro carregado, pode desativar aqui o aumento de nitidez. Por predefinição, as imagens carregadas com menos de 1600px são afetadas por esta definição. Para todas as outras imagens são entregues miniaturas mais pequenas e esta definição não se aplica."
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_LABEL="Utilizar rotação automática"
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_DESCRIPTION="Roda as imagens com base no indicador de rotação que faz parte da informação EXIF guardada em cada imagem. Não se esqueça de limpar a cache e sincronizar a base de dados se alterar esta opção."
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_LABEL="Substituir por dados IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_DESCRIPTION="Se definido como Sim, os campos de data de criação, legenda e título de uma imagem na base de dados são substituídos pelos dados IPTC do ficheiro de imagem. Caso contrário, os dados IPTC são utilizados apenas para preencher os campos inicialmente."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_LABEL="Utilizar dados IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_DESCRIPTION="Utilize esta opção para ativar ou desativar a utilização de dados IPTC para obter dados como a descrição e o título da imagem."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_LABEL="Qualidade da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_DESC="Define a qualidade de saída de todas as imagens geradas. A predefinição é 85\%, o que é bastante bom. Valores mais baixos resultam em menor qualidade."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_LABEL="Parâmetro anticache"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_DESC="As imagens ficam em cache nos navegadores e as pessoas não veriam as suas atualizações. O valor deste parâmetro é adicionado aos URL das imagens locais e do S3. Isto ajuda a forçar os navegadores a recarregar as imagens caso as tenha alterado."
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_LABEL="Matriz de nitidez"
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_DESCRIPTION="Não altere isto se não souber o que está a fazer! A predefinição é [[-1,-1,-1],[-1,16,-1],[-1,-1,-1]]. Permite definir a nitidez das imagens calculadas. Se alterar este valor, tem de limpar a cache deste componente para ver o resultado. Como definir a matriz? http://php.net/manual/en/function.imageconvolution.php"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_LABEL="Mostrar nome do ficheiro"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_DESCRIPTION="Define se é mostrado o nome do ficheiro da imagem atual, para que os potenciais clientes o fiquem a conhecer."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_LABEL="Mostrar título da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_DESCRIPTION="Mostra o título da imagem."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_LABEL="Mostrar legenda da imagem"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_DESCRIPTION="Mostra a descrição de uma imagem."
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_LABEL="Baralhar imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_DESCRIPTION="Se definido como Sim, as imagens de um evento são apresentadas por ordem aleatória. Só funciona se não houver paginação ativa e afeta apenas o componente."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_LABEL="Utilizar carregamento diferido"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_DESCRIPTION="Por predefinição, deve deixar esta opção ativada. Se o seu tema não suportar carregamento diferido, pode desativá-la. Normalmente, o sintoma é as imagens colocadas abaixo da dobra não serem visíveis. Nesse caso, defina esta opção como Não"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_LABEL="Utilizar marcas de água nas imagens principais"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_DESCRIPTION="Define se as marcas de água aparecem nas imagens principais (as imagens de um evento marcadas com a estrela)."

