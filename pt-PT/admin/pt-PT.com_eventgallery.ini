COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_DESCRIPTION="Os controlos que uma imagem apresenta no modo de compra. O botão do carrinho abre a janela de formatos dessa imagem. O visto seleciona a imagem; uma barra na parte inferior da página abre então uma única janela de formatos para toda a seleção."
