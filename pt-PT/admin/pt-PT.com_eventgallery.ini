COM_EVENTGALLERY_SYNC_START2_DESC="Esta página coloca a base de dados em sintonia com os ficheiros do seu armazenamento.<br><br>Escolha os eventos que pretende atualizar - os novos já vêm assinalados - e prima <b>Iniciar</b>. A página começa por ler as pastas e descobrir quais dos seus ficheiros a base de dados não conhece e, em seguida, lê esses ficheiros e grava os respetivos metadados. Enquanto os ficheiros locais aparecem sempre, os ficheiros remotos só aparecem quando o hash do original foi alterado.<br><br>A segunda fase é a mais dispendiosa, por isso existe um segundo botão que para depois da primeira: os seus eventos e os respetivos ficheiros ficam então atualizados na base de dados, faltando apenas as dimensões das imagens. Se utiliza o Amazon S3 e tem uma pasta nova, pode poupar largura de banda criando as miniaturas antes de a sincronizar: cada sincronização transfere o ficheiro original completo para o medir."
