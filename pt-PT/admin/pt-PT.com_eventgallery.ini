COM_EVENTGALLERY_OPTIONS_EVENTS_SORT_FILES_BY_COLUMN_DESC="Define um atributo pelo qual os ficheiros são ordenados."
COM_EVENTGALLERY_OPTIONS_EVENTS_SORT_FILES_BY_DIRECTION_LABEL="Direção da ordenação dos ficheiros"
COM_EVENTGALLERY_OPTIONS_EVENTS_SORT_FILES_BY_DIRECTION_DESC="Define a direção para o atributo de ordenação selecionado na lista pendente acima."
COM_EVENTGALLERY_OPTIONS_EVENTS_SORT_FILES_BY_DIRECTION_ASCENDING="Ascendente"
COM_EVENTGALLERY_OPTIONS_EVENTS_SORT_FILES_BY_DIRECTION_DESCENDING="Descendente"

