COM_EVENTGALLERY_SYNC_INTRO="Coloca a base de dados em sintonia com os ficheiros do seu armazenamento: novos eventos e imagens novas ou alteradas. Os novos eventos já vêm assinalados."
COM_EVENTGALLERY_SYNC_HOW="Como funciona a sincronização"
COM_EVENTGALLERY_SYNC_HOW_SCAN="A <b>fase 1</b> lê as pastas dos eventos assinalados e encontra os ficheiros que a base de dados ainda não conhece. Os ficheiros locais aparecem sempre; os ficheiros no S3, no Flickr ou no Google Photos apenas quando o hash do original mudou."
COM_EVENTGALLERY_SYNC_HOW_FILES="A <b>fase 2</b> lê esses ficheiros e grava os respetivos metadados - tamanho, data, legenda. É a mais exigente: no S3, cada original é transferido por completo para ser medido. <i>Sincronizar apenas os eventos</i> termina após a fase 1; as imagens ficam então listadas, mas ainda sem dimensões."
COM_EVENTGALLERY_SYNC_HOW_S3="Uma nova pasta no S3? Execute primeiro o Gerador de miniaturas; poupa largura de banda."
COM_EVENTGALLERY_SYNC_START_BUTTON="Sincronizar eventos e imagens"
COM_EVENTGALLERY_THUMBNAILGENERATOR_INTRO="Cria as miniaturas dos eventos S3 e locais. Nada vem assinalado - criar miniaturas custa tempo e pedidos ao S3."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW="Como funciona o Gerador de miniaturas"
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_SCAN="A <b>fase 1</b> encontra as miniaturas em falta dos eventos assinalados e a <b>fase 2</b> cria-as. <i>Apenas procurar miniaturas em falta</i> termina após a fase 1. No fim, a página indica o que não conseguiu fazer."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_COST="Demora muito tempo, e cada miniatura é um pedido ao S3 que tem de pagar. Pode servir um bucket a partir de vários sítios, mas crie as miniaturas apenas a partir de um deles: a base de dados guarda os hashes dos originais e das miniaturas e, onde faltarem, as miniaturas são criadas de novo."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_LOCAL="Para eventos locais, esta página é opcional - as respetivas miniaturas são criadas quando um visitante as pede pela primeira vez."
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_BUTTON="Encontrar e criar miniaturas"
COM_EVENTGALLERY_THUMBNAILGENERATOR_REFRESHETAGS_LABEL="Manter as miniaturas que já existem no bucket"
COM_EVENTGALLERY_CLEAR_CACHE_INTRO="Esvazia as caches que assinalar. O que for removido é criado de novo quando for necessário."
COM_EVENTGALLERY_CLEAR_CACHE_START_BUTTON="Limpar as caches selecionadas"
COM_EVENTGALLERY_CLEAR_CACHE_SELECT_HINT="Assinale primeiro pelo menos uma cache."
