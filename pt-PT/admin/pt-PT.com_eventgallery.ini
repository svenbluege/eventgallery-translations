COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_LABEL="Utilizar cache"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_DESCRIPTION="Consulte o manual sobre este parâmetro. Em resumo: ativa a cache de alguns elementos, como consultas SQL e módulos, mesmo que a cache do Joomla! não esteja ativada."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_LABEL="Proteger ficheiros"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_DESCRIPTION="Se definido como Sim, o sistema cria um ficheiro .htaccess para os ficheiros locais, que impede o acesso direto às imagens carregadas. Se desativar esta opção de configuração, terá de remover os ficheiros .htaccess existentes. Não se esqueça da pasta raiz das imagens. Se ativar esta opção, utilize depois a função Sincronizar base de dados, que criará os ficheiros .htaccess. Tenha em atenção que isto só funciona em sistemas que suportam ficheiros .htaccess."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_LABEL="Utilizar miniaturas pré-calculadas para imagens locais"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_DESCRIPTION="Esta opção alterna entre a geração dinâmica de miniaturas e a entrega de ficheiros estáticos. Pode pré-calcular as miniaturas com a função de sincronização da base de dados. Se não o fizer, não verá nenhuma imagem. Na maioria dos servidores, esta opção pode ficar desativada."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FAILED="O Event Gallery não conseguiu atualizar a proteção de acesso da pasta %s. Verifique as permissões dos ficheiros e elimine ou restaure manualmente os ficheiros .htaccess e web.config dessa pasta. Caso contrário, as suas miniaturas podem não ser entregues corretamente."

COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_LABEL="Grupo de utilizadores a notificar"
COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_DESCRIPTION="Grupo de utilizadores que recebe uma mensagem quando chega uma nova encomenda."
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_LABEL="Grupo de utilizadores predefinido"
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_DESCRIPTION="Define o grupo de utilizadores a que um utilizador tem de pertencer se o evento não especificar outra coisa."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_LABEL="Mostrar na lista eventos específicos de grupos de utilizadores"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_DESCRIPTION="Define se pretende mostrar nas listas de eventos os eventos específicos de grupos de utilizadores. Continuam a não aparecer nos módulos. Mostre-os para que os utilizadores saibam que há conteúdos para os quais têm de iniciar sessão."

COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_ADDRESS_OPTIONS_LABEL="<strong>Moradas</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_LABEL="Utilizar carrinho"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_DESCRIPTION="Define se os botões de adicionar ao carrinho são apresentados."
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_LABEL="Mostrar o carrinho do componente"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="As páginas do Event Gallery mostram o carrinho como uma barra no fundo da janela enquanto este tiver algum item. Enquanto o módulo do carrinho estiver visível numa página, a barra recua, para que o carrinho apareça só uma vez. Desative esta opção para mostrar o carrinho apenas no módulo. Mantenha pelo menos um dos dois: sem nenhum, não é possível adicionar ao carrinho."
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_LABEL="Controlos de compra nas imagens"
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_DESCRIPTION="Os controlos que uma imagem apresenta no modo de compra. O botão do carrinho abre a janela de formatos dessa imagem. O visto seleciona a imagem; uma barra na parte inferior da página abre então uma única janela de formatos para toda a seleção."
