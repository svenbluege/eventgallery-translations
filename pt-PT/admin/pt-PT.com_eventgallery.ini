COM_EVENTGALLERY_WATERMARK_HINT_CACHE_REFRESH="Certifique-se de que limpa a cache depois de alterar a configuração de uma marca de água. Caso contrário, verá imagens sem marca de água ou com marcas de água antigas. A marca de água predefinida é utilizada sempre que não definir uma marca de água própria para um evento ou quando a marca de água atribuída não estiver publicada. Uma marca de água predefinida não publicada nunca é utilizada."
