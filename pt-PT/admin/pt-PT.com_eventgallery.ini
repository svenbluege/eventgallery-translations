COM_EVENTGALLERY_SURCHARGES_INTRO="Uma sobretaxa é um valor adicional numa encomenda, por exemplo uma taxa de processamento. A maioria das lojas não precisa de nenhuma. Quando várias se aplicam a uma encomenda, é cobrada a primeira desta lista."
COM_EVENTGALLERY_SURCHARGES_HELP_TITLE="Como funcionam as sobretaxas"
COM_EVENTGALLERY_SURCHARGES_HELP_1="A regra de uma sobretaxa decide a que encomendas se aplica: pelo subtotal ou pelo número de itens, de um mínimo até um máximo, ambos incluídos."
