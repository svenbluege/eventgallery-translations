COM_EVENTGALLERY_PAYMENTMETHODS_HELP_TITLE="Como funcionam os métodos de pagamento"
COM_EVENTGALLERY_PAYMENTMETHODS_HELP_1="O fornecedor decide como um método recebe o dinheiro. Standard serve para pagamentos fora da loja – pagamento em dinheiro no levantamento, transferência bancária, pagamento à cobrança – e funciona de imediato. O PayPal Checkout e o Stripe precisam de uma conta nesses serviços; as respetivas chaves são introduzidas no formulário do método."
COM_EVENTGALLERY_PAYMENTMETHODS_HELP_2="Um método só é oferecido para os carrinhos a que se adequa: carrinhos com impressões, com transferências ou com ambos. Os distintivos por baixo do nome indicam quais."
COM_EVENTGALLERY_PAYMENTMETHODS_HELP_3="Os compradores precisam também de um método de envio publicado que se adeque ao seu carrinho."
