COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_DIGITALOCEAN="Introduza a região do seu Space, por exemplo fra1. O Spaces publica ficheiros individuais por ACL, por isso a opção ACL está ativada."
