PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT="Event Gallery - Relatório de capacidades"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_XML_DESCRIPTION="Este plugin mostra as capacidades do Event Gallery no relatório de capacidades do Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_EXTENSION_NAME="Event Gallery"

PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_COOKIES="<b>Cookies:</b> Não são definidos cookies adicionais. Para a gestão de sessões, o Event Gallery utiliza a gestão de sessões do Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_GOOGLEPHOTOS="<b>Google Photos:</b> <p>Servir imagens a partir do Google Photos faz com que os utilizadores carreguem conteúdos dos servidores da Google.</p><p>A gestão do Google Photos na administração do Event Gallery também chama serviços da Google. Os dados dos seus utilizadores da administração são utilizados para chamar esses serviços, como o seletor de álbuns.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_FLICKR="<b>Flickr:</b> Servir imagens a partir do Flickr faz com que os utilizadores carreguem dados de um serviço externo. Além disso, o seu servidor comunica com os serviços do Flickr. Esta comunicação não envolve dados dos seus utilizadores."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_S3="<b>S3:</b> Servir imagens a partir do Amazon S3 faz com que os utilizadores carreguem dados de um serviço externo. Além disso, o seu servidor comunica com o serviço Amazon S3. Esta comunicação não envolve dados dos seus utilizadores."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_CHECKOUT="<b>Finalização da compra</b><p>Antes de poder criar uma encomenda, o utilizador reúne itens no seu carrinho. Durante a finalização da compra, este carrinho é completado com os dados de morada. Depois de submetida, a encomenda é criada como uma cópia do carrinho. Além das informações dos itens, são guardados os dados de morada do cliente. A quantidade de dados depende da configuração do componente.</p><p>Os dados de morada existem em três locais: no carrinho, na encomenda e no objeto de utilizador do Joomla!. Embora isto não possa ser alterado para o carrinho e para a encomenda, pode configurar nas opções do componente que o objeto de utilizador não seja utilizado para guardar dados.</p><p>Para alguns métodos de pagamento são utilizados serviços externos. O Event Gallery não guarda dados de pagamento diretos. Em vez disso, é utilizado um token gerado para identificar a transação criada pelo fornecedor de pagamentos externo.</p><p>A administração do Event Gallery permite limpar os carrinhos com mais de 30 dias através de um simples clique numa ligação.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_STRIPE="<b>Pagamento // Stripe:</b> Para iniciar um pagamento, o Event Gallery envia à Stripe o endereço de e-mail, o número da encomenda e o montante. O processo de pagamento redireciona o seu cliente para uma página alojada pela Stripe, onde a Stripe pode recolher dados do utilizador. Nada da Stripe é carregado no seu próprio sítio."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_PAYPAL="<b>Pagamento // PayPal:</b> Para criar uma transação PayPal, o Event Gallery tem de enviar o ID da encomenda ao PayPal. O processo de pagamento redireciona o seu cliente para o PayPal, que pode assim recolher dados do utilizador."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_SHARING="<b>Partilha social:</b> O Event Gallery utiliza apenas opções de partilha passivas. Cabe ao utilizador do sítio acionar as opções de partilha dos diferentes serviços. Não existem SDK de JavaScript que transmitam dados antes de qualquer interação."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_YOUTUBE="<b>YouTube:</b> Para facilitar os primeiros passos e prestar alguma ajuda, a administração incorpora alguns vídeos do YouTube."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_LOGS="<b>Registos:</b> O Event Gallery escreve alguns ficheiros de registo. Estes contêm o endereço IP do utilizador do sítio. Além de registos de tarefas de processamento, por exemplo do Google Photos/Flickr/Amazon S3, escreve registos das transações de pagamento. Pode encontrar esses ficheiros de registo na sua pasta de registos. Contêm dados de utilizadores e têm de ser tratados com cuidado."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_MESSAGES="<b>Mensagens:</b> Os utilizadores podem denunciar imagens ou deixar mensagens sobre imagens. Podem indicar um endereço de e-mail e uma mensagem. Ambos são guardados na base de dados."
