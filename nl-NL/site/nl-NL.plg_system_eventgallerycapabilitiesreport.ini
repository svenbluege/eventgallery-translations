PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT="Event Gallery - Mogelijkhedenrapport"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_XML_DESCRIPTION="Deze plugin toont de mogelijkheden van Event Gallery in het mogelijkhedenrapport van Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_EXTENSION_NAME="Event Gallery"

PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_COOKIES="<b>Cookies:</b> Er worden geen extra cookies geplaatst. Voor sessiebeheer gebruikt Event Gallery het sessiebeheer van Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_GOOGLEPHOTOS="<b>Google Photos:</b> <p>Als afbeeldingen vanuit Google Photos worden geleverd, laden gebruikers inhoud van Google-servers.</p><p>Het beheren van Google Photos in de backend van Event Gallery roept ook Google-diensten aan. De gegevens van je backendgebruikers worden gebruikt om deze diensten aan te roepen, zoals de albumkiezer.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_FLICKR="<b>Flickr:</b> Als afbeeldingen vanuit Flickr worden geleverd, laden gebruikers gegevens van een externe dienst. Daarnaast communiceert je server met Flickr-diensten. Bij deze communicatie zijn geen gegevens van je gebruikers betrokken."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_S3="<b>S3</b> Als afbeeldingen vanuit Amazon S3 worden geleverd, laden gebruikers gegevens van een externe dienst. Daarnaast communiceert je server met de Amazon S3-dienst. Bij deze communicatie zijn geen gegevens van je gebruikers betrokken."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_CHECKOUT="<b>Afrekenen</b><p>Voordat een gebruiker een bestelling kan plaatsen, verzamelt hij artikelen in zijn winkelwagen. Tijdens het afrekenen wordt deze winkelwagen aangevuld met adresgegevens. Na het plaatsen wordt de bestelling aangemaakt als kopie van de winkelwagen. Naast de artikelgegevens worden ook adresgegevens van de klant opgeslagen. De hoeveelheid gegevens hangt af van de configuratie van de component.</p><p>Adresgegevens bestaan op drie plaatsen: winkelwagen, bestelling en het Joomla!-gebruikersobject. Voor de winkelwagen en de bestelling kan dit niet worden gewijzigd, maar in de opties van de component kun je instellen dat het gebruikersobject niet wordt gebruikt om gegevens op te slaan.</p><p>Voor sommige betaalmethoden worden externe diensten gebruikt. Event Gallery slaat geen directe betaalgegevens op. In plaats daarvan wordt een gegenereerd token gebruikt om de transactie te identificeren die door de externe betaalprovider is aangemaakt.</p><p>In de backend van Event Gallery kun je met één klik op een link winkelwagens verwijderen die ouder zijn dan 30 dagen.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_STRIPE="<b>Betaling // Stripe:</b> Om een betaling te starten, stuurt Event Gallery het e-mailadres, het bestelnummer en het bedrag naar Stripe. Het betaalproces stuurt je klant door naar een pagina die door Stripe wordt gehost, waar Stripe gebruikersgegevens kan verzamelen. Er wordt niets van Stripe in je eigen website geladen."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_PAYPAL="<b>Betaling // PayPal:</b> Om een PayPal-transactie aan te maken, moet Event Gallery het bestelnummer naar PayPal sturen. Het betaalproces stuurt je klant door naar PayPal, zodat PayPal gebruikersgegevens kan verzamelen."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_SHARING="<b>Sociaal delen:</b> Event Gallery gebruikt alleen passieve deelopties. Het is aan de gebruiker in de frontend om de deelopties van de verschillende diensten te activeren. Er zijn geen JavaScript-SDK's die gegevens versturen vóór enige interactie."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_YOUTUBE="<b>YouTube:</b> Om je op weg te helpen, toont de backend enkele YouTube-video's."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_LOGS="<b>Logs:</b> Event Gallery schrijft enkele logbestanden. Deze bevatten het IP-adres van de websitegebruiker. Naast verwerkingstaken zoals voor Google Photos/Flickr/Amazon S3 schrijft het logs voor betaaltransacties. Je vindt deze logbestanden in je logmap. Ze bevatten gebruikersgegevens en moeten zorgvuldig worden behandeld."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_MESSAGES="<b>Berichten:</b> Gebruikers kunnen afbeeldingen melden of berichten bij afbeeldingen achterlaten. Ze kunnen een e-mailadres en een bericht opgeven. Beide worden in de database opgeslagen."
