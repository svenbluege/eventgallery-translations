COM_EVENTGALLERY_SYNC_START2_DESC="Deze pagina brengt de database in lijn met de bestanden in je opslag.<br><br>Kies de evenementen die je wilt bijwerken - nieuwe zijn al voor je aangevinkt - en klik op <b>Starten</b>. De pagina leest eerst de mappen en zoekt uit welke bestanden de database nog niet kent, en leest daarna die bestanden en slaat hun metadata op. Lokale bestanden verschijnen altijd, externe bestanden alleen als de hash van het origineel is gewijzigd.<br><br>De tweede fase is de dure, daarom is er een tweede knop die na de eerste stopt: je evenementen en hun bestanden zijn dan bijgewerkt in de database, alleen de afmetingen van de afbeeldingen niet. Als je Amazon S3 gebruikt en een nieuwe map hebt, kun je bandbreedte besparen door de miniaturen aan te maken voordat je de map synchroniseert: elke synchronisatie downloadt het originele bestand volledig om het te meten."
