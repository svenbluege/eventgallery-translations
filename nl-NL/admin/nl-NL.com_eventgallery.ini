COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_DESCRIPTION="Bepaalt of evenementen voor specifieke gebruikersgroepen in lijsten met evenementen worden getoond. In modules verschijnen ze nog steeds niet. Toon ze om gebruikers te laten weten dat er iets is waarvoor ze moeten inloggen."

