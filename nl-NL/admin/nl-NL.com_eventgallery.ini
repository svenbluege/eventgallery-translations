COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="De pagina's van Event Gallery tonen de winkelwagen als een balk onderaan het venster zolang er iets in zit. Zolang de winkelwagenmodule op een pagina te zien is, treedt de balk terug, zodat de winkelwagen maar één keer verschijnt. Schakel dit uit om de winkelwagen alleen in de module te tonen. Houd minstens een van de twee aan: zonder werkt het toevoegen aan de winkelwagen niet."
