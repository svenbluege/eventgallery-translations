COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_LABEL="Bestanden beveiligen"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_DESCRIPTION="Bij Ja maakt het systeem voor lokale bestanden een .htaccess-bestand aan dat directe toegang tot de geüploade afbeeldingen voorkomt. Als je deze optie uitschakelt, moet je de bestaande .htaccess-bestanden zelf verwijderen. Vergeet de hoofdmap van de afbeeldingen niet. Als je deze optie inschakelt, gebruik dan daarna Database synchroniseren; dat maakt de .htaccess-bestanden aan. Dit werkt alleen op systemen die .htaccess-bestanden ondersteunen."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_LABEL="Vooraf berekende miniaturen voor lokale afbeeldingen"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_DESCRIPTION="Deze optie schakelt tussen het dynamisch genereren van miniaturen en het leveren van statische bestanden. Je kunt de miniaturen vooraf berekenen met de functie Database synchroniseren. Doe je dat niet, dan zie je geen afbeeldingen. Voor de meeste servers kan deze optie uit blijven."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FAILED="Event Gallery kon de toegangsbeveiliging van de map %s niet bijwerken. Controleer de bestandsrechten en verwijder of herstel de bestanden .htaccess en web.config in die map handmatig. Anders worden je miniaturen mogelijk niet correct geleverd."

