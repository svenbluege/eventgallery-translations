COM_EVENTGALLERY_SUBMENU_THUMBNAILGENERATOR="Miniatuurgenerator"
COM_EVENTGALLERY_THUMBNAILGENERATOR_START2_DESC="Deze pagina toont je S3- en lokale evenementen. Elke afbeelding in de bucket met originelen heeft haar miniaturen nodig.<br><br>Vink de evenementen aan waaraan je wilt werken - er is niets voor je aangevinkt, omdat dit duur is - en klik op <b>Starten</b>. De pagina zoekt eerst de ontbrekende miniaturen en maakt ze daarna aan; de tweede knop zoekt alleen. Aan het eind meldt ze wat ze niet kon doen.<br><br><b>Dit duurt lang</b>, en elke miniatuur is een POST-bewerking waarvoor je betaalt. Je kunt één S3-bucket vanaf meerdere sites gebruiken, maar maak de miniaturen vanaf slechts één ervan aan: de database bevat de checksums van de originelen en de miniaturen, en waar die ontbreken, worden de miniaturen opnieuw gemaakt. Voor lokale evenementen is deze pagina optioneel - hun miniaturen worden op aanvraag aangemaakt."
COM_EVENTGALLERY_THUMBNAILGENERATOR_GETMISSINGTHUMBNAILS="Ontbrekende miniaturen zoeken"
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_THUMBNAILCREATION="Miniaturen maken"
COM_EVENTGALLERY_THUMBNAILGENERATOR_REFRESHETAGS_DESC="Hashes van miniaturen vernieuwen. Gebruik deze optie om de hashwaarden van bestaande miniaturen naar de database te schrijven. Zo voorkom je dat miniaturen onnodig twee keer worden gemaakt, wat zou gebeuren als twee verschillende servers dezelfde bucket gebruiken. Gebruik deze optie niet als je miniaturen echt opnieuw moet maken!"
