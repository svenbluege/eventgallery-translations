COM_EVENTGALLERY_SYNC_INTRO="Brengt de database in lijn met de bestanden in je opslag: nieuwe evenementen, nieuwe en gewijzigde afbeeldingen. Nieuwe evenementen zijn al voor je aangevinkt."
COM_EVENTGALLERY_SYNC_HOW="Zo werkt de synchronisatie"
COM_EVENTGALLERY_SYNC_HOW_SCAN="<b>Fase 1</b> leest de mappen van de aangevinkte evenementen en vindt de bestanden die de database nog niet kent. Lokale bestanden verschijnen altijd; bestanden op S3, Flickr of Google Photos alleen als de hash van het origineel is gewijzigd."
COM_EVENTGALLERY_SYNC_HOW_FILES="<b>Fase 2</b> leest die bestanden en schrijft hun metadata - grootte, datum, bijschrift. Dit is de dure fase: bij S3 wordt elk origineel volledig gedownload om het te meten. <i>Alleen evenementen synchroniseren</i> stopt na fase 1; de afbeeldingen staan dan in de lijst, maar hebben nog geen afmetingen."
COM_EVENTGALLERY_SYNC_HOW_S3="Een nieuwe map op S3? Laat eerst de Miniatuurgenerator lopen; dat bespaart bandbreedte."
COM_EVENTGALLERY_SYNC_START_BUTTON="Evenementen en afbeeldingen synchroniseren"
COM_EVENTGALLERY_THUMBNAILGENERATOR_INTRO="Maakt de miniaturen van S3- en lokale evenementen. Er is niets voor je aangevinkt - miniaturen maken kost tijd en S3-verzoeken."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW="Zo werkt de Miniatuurgenerator"
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_SCAN="<b>Fase 1</b> zoekt de ontbrekende miniaturen van de aangevinkte evenementen, <b>fase 2</b> maakt ze. <i>Alleen ontbrekende miniaturen zoeken</i> stopt na fase 1. Aan het eind noemt de pagina wat niet is gelukt."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_COST="Dit duurt lang, en elke miniatuur is een verzoek aan S3 waarvoor je betaalt. Je kunt één bucket vanaf meerdere sites gebruiken, maar maak de miniaturen dan vanaf maar één ervan: de database bevat de hashes van de originelen en de miniaturen, en waar die ontbreken, worden de miniaturen opnieuw gemaakt."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_LOCAL="Voor lokale evenementen is deze pagina optioneel - hun miniaturen worden gemaakt zodra een bezoeker er voor het eerst om vraagt."
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_BUTTON="Miniaturen zoeken en maken"
COM_EVENTGALLERY_THUMBNAILGENERATOR_REFRESHETAGS_LABEL="Miniaturen behouden die al in de bucket staan"
COM_EVENTGALLERY_CLEAR_CACHE_INTRO="Leegt de caches die je aanvinkt. Wat wordt verwijderd, wordt opnieuw gemaakt zodra het nodig is."
COM_EVENTGALLERY_CLEAR_CACHE_START_BUTTON="De geselecteerde caches legen"
