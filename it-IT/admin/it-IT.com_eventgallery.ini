COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_LABEL="Mostra la didascalia dell'immagine"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_DESCRIPTION="Mostra la descrizione di un'immagine."
