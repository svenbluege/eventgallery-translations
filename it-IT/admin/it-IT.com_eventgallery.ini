COM_EVENTGALLERY_SHIPPINGMETHODS_HELP_1="Il provider decide che cosa consegna un metodo: Standard Ground spedisce stampe, Download ed Email consegnano download, e Mixed si adatta ai carrelli che scegli nel suo modulo."
COM_EVENTGALLERY_SHIPPINGMETHODS_HELP_2="Un metodo che chiede un indirizzo fa inserire agli acquirenti il loro indirizzo postale al checkout; altrimenti bastano il nome e l'email."
