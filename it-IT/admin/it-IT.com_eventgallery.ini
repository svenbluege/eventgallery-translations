COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_DESCRIPTION="Se impostato su Sì, le immagini di un evento vengono mostrate in ordine casuale. Funziona solo se la paginazione non è attiva e riguarda soltanto il componente."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_LABEL="Usa il lazy loading"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_DESCRIPTION="Di norma lascia questa opzione abilitata. Se il tuo template non supporta il lazy loading, puoi disattivarla. Di solito te ne accorgi perché le immagini che si trovano sotto la parte visibile della pagina non vengono mostrate. In tal caso imposta questa opzione su No"
