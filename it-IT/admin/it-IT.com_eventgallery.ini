COM_EVENTGALLERY_SUBMENU_THUMBNAILGENERATOR="Creazione miniature"
COM_EVENTGALLERY_THUMBNAILGENERATOR_START2_DESC="Questa pagina mostra i tuoi eventi S3 e locali. Ogni immagine nel bucket degli originali ha bisogno delle sue miniature.<br><br>Seleziona gli eventi su cui vuoi lavorare - nessuno è preselezionato, perché l'operazione è costosa - e premi <b>Avvia</b>. La pagina cerca prima le miniature mancanti e poi le crea; il secondo pulsante esegue solo la ricerca. Alla fine indica ciò che non è riuscita a fare.<br><br><b>L'operazione richiede molto tempo</b> e ogni miniatura è un'operazione POST che paghi. Puoi servire un bucket S3 da più siti, ma crea le miniature da uno solo di essi: il database contiene i checksum degli originali e delle miniature, e dove mancano le miniature vengono create di nuovo. Per gli eventi locali questa pagina è facoltativa: le loro miniature vengono create su richiesta."
