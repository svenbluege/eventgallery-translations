COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOADID_MISSING_WARNING="Manca il Download ID. Per poter aggiornare automaticamente Event Gallery Extended, aggiungi il tuo Download ID nel menu dei siti di aggiornamento (<a href=\"%s\">qui</a>). Puoi ottenere il tuo ID da <a href=\"https://www.svenbluege.de/subscribe/download-id\">My Download ID</a>."
COM_EVENTGALLERY_OPTIONS_COMMON_UPDATESITE_MISSING_WARNING="Manca il Download ID e Joomla non ha un sito di aggiornamento per Event Gallery Extended a cui aggiungerlo. Apri <a href=\"%s\">Sistema - Siti di aggiornamento</a>, clicca su Ricostruisci e poi aggiungi il tuo Download ID alla voce Event Gallery Extended - Package. Puoi ottenere il tuo ID da <a href=\"https://www.svenbluege.de/subscribe/download-id\">My Download ID</a>."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_LABEL="Usa la cache"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_DESCRIPTION="Consulta il manuale per questo parametro. In breve: abilita la cache di alcuni elementi, come le query SQL e i moduli, anche se la cache di Joomla! non è abilitata."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_LABEL="Proteggi i file"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_DESCRIPTION="Se impostato su Sì, il sistema crea per i file locali un file .htaccess che impedisce l'accesso diretto alle immagini caricate. Se disabiliti questa opzione, devi rimuovere tu stesso i file .htaccess esistenti. Non dimenticare la cartella principale delle immagini. Se abiliti questa opzione, esegui poi la sincronizzazione del database, che creerà i file .htaccess. Nota che funziona solo sui sistemi che supportano i file .htaccess."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_LABEL="Usa miniature precalcolate per le immagini locali"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_DESCRIPTION="Questa opzione alterna tra la generazione dinamica delle miniature e la distribuzione di file statici. Puoi precalcolare le miniature con la funzione di sincronizzazione del database. Se non lo fai, non vedrai alcuna immagine. Per la maggior parte dei server questa opzione può restare disattivata."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FAILED="Event Gallery non è riuscito ad aggiornare la protezione di accesso della cartella %s. Controlla i permessi dei file ed elimina o ripristina manualmente i file .htaccess e web.config in quella cartella. Altrimenti le miniature potrebbero non essere distribuite correttamente."

COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_LABEL="Gruppo utenti per le notifiche"
COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_DESCRIPTION="Gruppo utenti che riceve un messaggio all'arrivo di un nuovo ordine."
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_LABEL="Gruppo utenti predefinito"
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_DESCRIPTION="Definisce il gruppo utenti a cui un utente deve appartenere se l'evento non specifica altro."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_LABEL="Mostra negli elenchi gli eventi riservati a gruppi utenti"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_DESCRIPTION="Definisce se mostrare negli elenchi di eventi gli eventi riservati a specifici gruppi utenti. Nei moduli continuano a non apparire. Mostrali per far sapere agli utenti che c'è qualcosa per cui devono effettuare l'accesso."

COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_ADDRESS_OPTIONS_LABEL="<strong>Indirizzi</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_LABEL="Usa il carrello"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_DESCRIPTION="Definisce se vengono mostrati i pulsanti Aggiungi al carrello."
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_LABEL="Mostra il carrello del componente"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="Le pagine di Event Gallery mostrano il carrello come una barra in fondo alla finestra quando contiene qualcosa. Finché il modulo del carrello è visibile su una pagina, la barra si ritira, così il carrello compare una sola volta. Disattiva questa opzione per mostrare il carrello solo nel modulo. Mantieni almeno uno dei due: senza nessuno dei due l'aggiunta al carrello non funziona."
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_LABEL="Controlli di acquisto sulle immagini"
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_DESCRIPTION="Quali controlli ha un'immagine in modalità acquisto. Il pulsante del carrello apre la finestra dei formati per quell'immagine. Il segno di spunta seleziona l'immagine; una barra in fondo alla pagina apre poi un'unica finestra dei formati per l'intera selezione."
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_BOTH="Pulsante del carrello e selezione"
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_SINGLE="Solo pulsante del carrello (un'immagine alla volta)"
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_SELECTION="Solo selezione (più immagini insieme)"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOW_CART_CONNECTOR_LABEL="Mostra link esterno al carrello"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOW_CART_CONNECTOR_DESCRIPTION="Definisce se mostrare il link aggiuntivo al carrello che puoi definire qui sotto."
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_REL_LABEL="Attributo rel del link esterno al carrello"
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_REL_DESCRIPTION="Definisce la relazione del link esterno al carrello. Il valore predefinito è nofollow, per impedire ai motori di ricerca di seguire il link."
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_LABEL="Link esterno al carrello"
COM_EVENTGALLERY_OPTIONS_COMMON_CART_CONNECTOR_LINK_DESCRIPTION="Definisce uno schema per un link esterno. Puoi usare i seguenti segnaposto: {folder}, {file}, {fileBase}, {categoryId}, {categorySlug} e {categoryTitle}, ad esempio così: http://www.foo.bar?category={folder}&amp;sku={fileBase}"
COM_EVENTGALLERY_OPTIONS_COMMON_USETERMCONDITIONS_LABEL="Mostra la casella di controllo T&amp;C"
COM_EVENTGALLERY_OPTIONS_COMMON_USETERMCONDITIONS_DESC="Il cliente deve accettare i termini e le condizioni prima di poter creare l'ordine"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWVAT_LABEL="Mostra IVA"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWVAT_DESC="Definisce se mostrare o meno l'importo dell'IVA inclusa."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDSTATE_LABEL="Mostra il campo Stato/Provincia"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDSTATE_DESC="Definisce se mostrare il menu a tendina per la selezione dello stato/provincia in un form di indirizzo."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDCOUNTRY_LABEL="Mostra il campo Paese"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDCOUNTRY_DESC="Definisce se mostrare il menu a tendina per la selezione del paese in un form di indirizzo."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDSTATE_MANDATORY_LABEL="Campo Stato/Provincia obbligatorio"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDSTATE_MANDATORY_DESC="Rende obbligatorio il campo Stato/Provincia."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDCOUNTRY_MANDATORY_LABEL="Campo Paese obbligatorio"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDCOUNTRY_MANDATORY_DESC="Rende obbligatorio il campo Paese."
COM_EVENTGALLERY_OPTIONS_CHECKOUT_ADDRESS_FORMAT_LABEL="Formato dell'indirizzo"
COM_EVENTGALLERY_OPTIONS_CHECKOUT_ADDRESS_FORMAT_DESC="Definisce in quale ordine appare la combinazione città/CAP/stato."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDPHONE_LABEL="Mostra il campo Telefono"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDPHONE_DESC="Chiede all'acquirente un numero di telefono. Disattivalo se non ti serve: meno dati personali chiede un modulo, meglio è."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDPHONE_MANDATORY_LABEL="Campo Telefono obbligatorio"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDPHONE_MANDATORY_DESC="Rende obbligatorio il campo Telefono."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDMESSAGE_LABEL="Mostra il campo Messaggio"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDMESSAGE_DESC="Permette all'acquirente di aggiungere un messaggio all'ordine."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDMESSAGE_MANDATORY_LABEL="Campo Messaggio obbligatorio"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSFIELDMESSAGE_MANDATORY_DESC="Rende obbligatorio il campo Messaggio."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_PRESELECTED_COUNTRY_LABEL="Paese preselezionato"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_PRESELECTED_COUNTRY_DESC="Definisce il paese selezionato per impostazione predefinita nel menu a tendina dei paesi durante il checkout. Devi usare il codice paese di due caratteri. Esempio: DE, US, GB. Puoi inserire un solo valore."
COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_LABEL="Usa il form di accesso"
COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_DESC="Puoi mostrare un form di accesso nella pagina dell'indirizzo del checkout, per consentire agli utenti di accedere e associare l'ordine al proprio account."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_LABEL="Usa i dati di indirizzo dell'utente"
