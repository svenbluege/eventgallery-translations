COM_EVENTGALLERY_SYNC_INTRO="Allinea il database ai file del tuo archivio: nuovi eventi, immagini nuove e modificate. I nuovi eventi sono già spuntati per te."
COM_EVENTGALLERY_SYNC_HOW="Come funziona la sincronizzazione"
COM_EVENTGALLERY_SYNC_HOW_SCAN="<b>La fase 1</b> legge le cartelle degli eventi spuntati e trova i file che il database non conosce ancora. I file locali compaiono sempre; i file su S3, Flickr o Google Photos solo quando l'hash dell'originale è cambiato."
COM_EVENTGALLERY_SYNC_HOW_FILES="<b>La fase 2</b> legge questi file e scrive i loro metadati - dimensioni, data, didascalia. È la fase più onerosa: per S3 ogni originale viene scaricato per intero per misurarlo. <i>Sincronizza solo gli eventi</i> si ferma dopo la fase 1; le immagini sono quindi elencate, ma non hanno ancora dimensioni."
COM_EVENTGALLERY_SYNC_HOW_S3="Una nuova cartella su S3? Esegui prima la Creazione miniature: risparmia banda."
COM_EVENTGALLERY_SYNC_START_BUTTON="Sincronizza eventi e immagini"
COM_EVENTGALLERY_THUMBNAILGENERATOR_INTRO="Crea le miniature degli eventi S3 e locali. Nulla è spuntato per te: creare miniature costa tempo e richieste S3."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW="Come funziona la Creazione miniature"
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_SCAN="<b>La fase 1</b> trova le miniature mancanti degli eventi spuntati, <b>la fase 2</b> le crea. <i>Trova solo le miniature mancanti</i> si ferma dopo la fase 1. Alla fine la pagina indica ciò che non è riuscita a fare."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_COST="Richiede molto tempo e ogni miniatura è una richiesta a S3 che paghi. Puoi servire un bucket da più siti, ma crea le miniature solo da uno di essi: il database contiene gli hash degli originali e delle miniature e, dove mancano, le miniature vengono create di nuovo."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_LOCAL="Per gli eventi locali questa pagina è facoltativa: le loro miniature vengono create quando un visitatore le richiede per la prima volta."
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_BUTTON="Trova e crea le miniature"
COM_EVENTGALLERY_THUMBNAILGENERATOR_REFRESHETAGS_LABEL="Mantieni le miniature già presenti nel bucket"
COM_EVENTGALLERY_CLEAR_CACHE_INTRO="Svuota le cache che spunti. Ciò che viene rimosso viene creato di nuovo quando serve."
COM_EVENTGALLERY_CLEAR_CACHE_START_BUTTON="Svuota le cache selezionate"
COM_EVENTGALLERY_CLEAR_CACHE_SELECT_HINT="Spunta prima almeno una cache."
COM_EVENTGALLERY_CLEAR_CACHE_CONFIRM="Svuotare %1$s cache (%2$s)? Vengono create di nuovo quando servono."
COM_EVENTGALLERY_CLEAR_CACHE_CONFIRM_1="Svuotare 1 cache (%2$s)? Viene creata di nuovo quando serve."

COM_EVENTGALLERY_EXTENDED_TITLE="Event Gallery Extended"
COM_EVENTGALLERY_EXTENDED_DESC="Il componente principale non ti basta? Vuoi sostenere lo sviluppo di questo componente? Se cerchi <strong>moduli aggiuntivi, eventi/immagini negli articoli, integrazione con la ricerca, metodi di pagamento PayPal</strong> e altre funzioni utili, potresti valutare il passaggio a Event Gallery Extended."
COM_EVENTGALLERY_EXTENDED_COMPARE="Confronta le versioni"
COM_EVENTGALLERY_EXTENDED_BANNER_TITLE="Ottieni di più dalle tue gallerie con Event Gallery Extended"
COM_EVENTGALLERY_EXTENDED_BANNER_INTRO="Stai usando la versione gratuita. L'abbonamento Extended aggiunge ciò che serve a un fotografo per vendere e presentare le immagini:"
