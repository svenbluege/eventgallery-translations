COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO_DESCRIPTION="Il logo in cima alle email inviate ai tuoi acquirenti. Usa un file PNG o JPG, molti programmi di posta non mostrano i file SVG. Senza logo viene mostrato il nome del tuo sito."
