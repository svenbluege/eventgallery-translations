COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_LABEL="Invia immagine via email"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_DESCRIPTION="Abilita un pulsante di condivisione che invia l'immagine stessa incorporata in un'email invece di un link. Usa la stessa dimensione dell'immagine usata dal download: l'immagine originale oppure la miniatura più grande."
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_LABEL="Dimensione massima dell'immagine per le email (MB)"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_DESCRIPTION="Per le immagini più grandi di questa dimensione viene inviata la miniatura più grande invece dell'immagine originale. Se anche la miniatura è troppo grande, al visitatore viene chiesto di usare il download."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_LABEL="Download delle immagini"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_DESCRIPTION="Abilita il pulsante di download delle immagini."
