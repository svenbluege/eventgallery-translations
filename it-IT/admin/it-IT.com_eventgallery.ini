COM_EVENTGALLERY_S3ACCOUNT_HOWTO="Crea prima il bucket (o i bucket) e una chiave di accesso presso il tuo provider di archiviazione. La chiave di accesso deve avere il permesso di elencare i bucket e di leggere, scrivere ed eliminare gli oggetti al loro interno. Il manuale descrive passo per passo la configurazione per ogni provider supportato."
