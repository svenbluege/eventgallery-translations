COM_EVENTGALLERY_PAYMENTMETHODS_HELP_TITLE="Come funzionano i metodi di pagamento"
COM_EVENTGALLERY_PAYMENTMETHODS_HELP_1="Il provider decide come un metodo incassa il denaro. Standard serve per i pagamenti al di fuori del negozio – contanti al ritiro, bonifico bancario, contrassegno – e funziona subito. PayPal Checkout e Stripe richiedono un account presso di loro; le relative chiavi vanno inserite nel modulo del metodo."
COM_EVENTGALLERY_PAYMENTMETHODS_HELP_2="Un metodo viene offerto solo per i carrelli a cui si adatta: carrelli con stampe, con download o con entrambi. I badge sotto il suo nome indicano quali."
COM_EVENTGALLERY_PAYMENTMETHODS_HELP_3="Gli acquirenti hanno bisogno anche di un metodo di spedizione pubblicato adatto al loro carrello."
