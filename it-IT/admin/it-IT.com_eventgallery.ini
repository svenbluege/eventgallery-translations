COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LABEL="Usa i file originali"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_DESCRIPTION="Definisce se per il download e i social media vengono usate le immagini originali, i file a bassa risoluzione o entrambi. I file a bassa risoluzione possono contenere una filigrana. Funziona solo per le immagini locali e per quelle di Amazon S3."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LOWRES="Bassa risoluzione"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_ORIGINAL="File originali"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_BOTH="Entrambi"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_LABEL="Accesso ai file originali"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_DESCRIPTION="Il gruppo utenti selezionato può scaricare i file originali."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_OVERRIDE_DESCRIPTION="Il gruppo utenti selezionato può scaricare i file originali. Se è selezionato solo il valore predefinito, vengono usati i gruppi utenti della configurazione del componente. Altrimenti le impostazioni dell'evento sostituiscono completamente l'impostazione dei gruppi utenti del componente."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_LABEL="URL di reindirizzamento"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_DESCRIPTION="Se il download non è consentito all'utente corrente, questi viene reindirizzato a questo URL. Qui puoi indicare, ad esempio, l'URL della tua pagina di abbonamento."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_LABEL="Segnalazione delle immagini"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_DESCRIPTION="Consente ai visitatori di segnalare le immagini. Puoi usare questa funzione per raccogliere note dai tuoi clienti o reclami da parte di chi desidera che la propria immagine venga eliminata."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_LABEL="Usa il rendering di fallback"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_DESC="Soluzione di ripiego che usa index.php per fornire le immagini. È lenta e non dovrebbe essere la tua soluzione a lungo termine. Contatta il tuo provider per assicurarti che gli script PHP possano essere eseguiti nelle cartelle dei componenti, almeno per components/com_eventgallery/helpers/image.php e blank.php."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_LABEL="Usa la nitidezza"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_DESCRIPTION="Abilita o disabilita del tutto l'aumento della nitidezza. Se abilitato, usa la matrice definita sotto."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_LABEL="Nitidezza sull'originale"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_DESCRIPTION="Se l'immagine viene inviata al browser nella stessa dimensione del file caricato, qui puoi disabilitare l'aumento della nitidezza. Per impostazione predefinita, questa impostazione riguarda le immagini caricate con una dimensione inferiore a 1600px. Per tutte le altre immagini vengono inviate miniature più piccole e questa impostazione non si applica."
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_LABEL="Usa la rotazione automatica"
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_DESCRIPTION="Ruota le immagini in base al flag di rotazione contenuto nelle informazioni EXIF salvate con ogni immagine. Se modifichi questa opzione, non dimenticare di svuotare la cache e sincronizzare il database."
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_LABEL="Sovrascrivi con i dati IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_DESCRIPTION="Se impostato su Sì, la data di creazione, la didascalia e il titolo di un'immagine nel database vengono sovrascritti con i dati IPTC del file dell'immagine. Altrimenti i dati IPTC vengono usati solo per compilare i campi la prima volta."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_LABEL="Usa i dati IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_DESCRIPTION="Usa questa opzione per abilitare o disabilitare l'uso dei dati IPTC per ricavare dati come la descrizione e il titolo dell'immagine."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_LABEL="Qualità dell'immagine"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_DESC="Definisce la qualità di ogni immagine generata. Il valore predefinito è 85\%, che è piuttosto buono. Valori più bassi danno una qualità inferiore."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_LABEL="Cache busting"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_DESC="Le immagini vengono memorizzate nella cache dei browser e i visitatori non vedrebbero i tuoi aggiornamenti. Il valore di questo parametro viene aggiunto agli URL delle immagini locali e S3. In questo modo i browser sono costretti a ricaricare le immagini quando le hai modificate."
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_LABEL="Matrice di nitidezza"
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_DESCRIPTION="Non toccare questo valore se non sai cosa stai facendo! Il valore predefinito è [[-1,-1,-1],[-1,16,-1],[-1,-1,-1]]. Permette di definire la nitidezza delle immagini calcolate. Se modifichi questo valore devi svuotare la cache di questo componente per vedere il risultato. Come impostare la matrice? http://php.net/manual/en/function.imageconvolution.php"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_LABEL="Mostra il nome del file"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_DESCRIPTION="Definisce se mostrare il nome del file dell'immagine corrente, così che i potenziali clienti lo conoscano."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_LABEL="Mostra il titolo dell'immagine"
