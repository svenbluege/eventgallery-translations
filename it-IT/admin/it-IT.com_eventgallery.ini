COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_DESCRIPTION="Se un'immagine è mostrata all'interno di un articolo, puoi configurare quale link viene condiviso."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_LABEL="Pulsante di download dedicato"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_DESCRIPTION="Mostra il pulsante di download accanto all'icona di condivisione sulla miniatura"
