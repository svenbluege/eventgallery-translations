COM_EVENTGALLERY_OPTIONS_EVENT_THUMBNAIL_HEIGHT_DESC="L'altezza di una riga di miniature in px. Le righe riempiono la larghezza con immagini intere, quindi una riga è un po' più bassa o più alta; su uno schermo stretto una riga è alta al massimo il 30 % della larghezza."
COM_EVENTGALLERY_OPTIONS_EVENT_THUMBNAIL_JITTER_LABEL="Variazione dell'altezza"
COM_EVENTGALLERY_OPTIONS_EVENT_THUMBNAIL_JITTER_DESC="Di quanti px l'altezza di una riga può variare verso l'alto e verso il basso, così che le righe non sembrino tutte uguali. 0 dà a ogni riga la stessa altezza."
