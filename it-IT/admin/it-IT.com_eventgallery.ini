COM_EVENTGALLERY_S3ACCOUNT_PROVIDER="Provider"
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_DESCRIPTION="Scegli il tuo provider di archiviazione per compilare i campi qui sotto con i valori che notoriamente funzionano per esso. In seguito puoi modificare ogni valore."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_CUSTOM="Altro servizio compatibile con S3"
COM_EVENTGALLERY_S3ACCOUNT_ENDPOINT_PLACEHOLDER_ERROR="L'endpoint non è un nome host valido. Se hai scelto un provider, sostituisci le parti tra parentesi angolari, come <ACCOUNT_ID> o <region>, con i tuoi valori."
