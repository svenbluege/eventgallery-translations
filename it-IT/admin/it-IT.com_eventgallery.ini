COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS="Indirizzo"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS_DESCRIPTION="Il tuo indirizzo di venditore. Le email ai tuoi acquirenti terminano con questo indirizzo, così possono vedere chi le ha inviate."
