COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_LABEL="Usa la cache"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_DESCRIPTION="Consulta il manuale per questo parametro. In breve: abilita la cache di alcuni elementi, come le query SQL e i moduli, anche se la cache di Joomla! non è abilitata."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_LABEL="Proteggi i file"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_DESCRIPTION="Se impostato su Sì, il sistema crea per i file locali un file .htaccess che impedisce l'accesso diretto alle immagini caricate. Se disabiliti questa opzione, devi rimuovere tu stesso i file .htaccess esistenti. Non dimenticare la cartella principale delle immagini. Se abiliti questa opzione, esegui poi la sincronizzazione del database, che creerà i file .htaccess. Nota che funziona solo sui sistemi che supportano i file .htaccess."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_LABEL="Usa miniature precalcolate per le immagini locali"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_DESCRIPTION="Questa opzione alterna tra la generazione dinamica delle miniature e la distribuzione di file statici. Puoi precalcolare le miniature con la funzione di sincronizzazione del database. Se non lo fai, non vedrai alcuna immagine. Per la maggior parte dei server questa opzione può restare disattivata."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FAILED="Event Gallery non è riuscito ad aggiornare la protezione di accesso della cartella %s. Controlla i permessi dei file ed elimina o ripristina manualmente i file .htaccess e web.config in quella cartella. Altrimenti le miniature potrebbero non essere distribuite correttamente."

COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_LABEL="Gruppo utenti per le notifiche"
COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_DESCRIPTION="Gruppo utenti che riceve un messaggio all'arrivo di un nuovo ordine."
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_LABEL="Gruppo utenti predefinito"
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_DESCRIPTION="Definisce il gruppo utenti a cui un utente deve appartenere se l'evento non specifica altro."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_LABEL="Mostra negli elenchi gli eventi riservati a gruppi utenti"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_DESCRIPTION="Definisce se mostrare negli elenchi di eventi gli eventi riservati a specifici gruppi utenti. Nei moduli continuano a non apparire. Mostrali per far sapere agli utenti che c'è qualcosa per cui devono effettuare l'accesso."

COM_EVENTGALLERY_OPTIONS_COMMON_LOAD_RESPONSIVE_ASSETS_LABEL="Carica CSS responsive"
COM_EVENTGALLERY_OPTIONS_COMMON_LOAD_RESPONSIVE_ASSETS_DESCRIPTION="Questa opzione attiva il caricamento di un file CSS responsive molto semplice. Consiglio di disattivarla e di aggiungere i tuoi stili, adatti ai breakpoint responsive del tuo template. La versione statica è per le pagine che limitano la larghezza del contenuto principale a un valore fisso. La versione fluida è utile se il tuo sito usa l'intera larghezza del browser."
