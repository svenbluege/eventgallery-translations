COM_EVENTGALLERY_EXTENDED_BENEFIT_DOWNLOADS="<strong>Vendi download</strong>: le immagini digitali vengono consegnate automaticamente dopo il pagamento"
COM_EVENTGALLERY_EXTENDED_BENEFIT_PLACEMENT="<strong>Mostra eventi e immagini ovunque</strong>: negli articoli e con sei moduli, incluso il carrello"
COM_EVENTGALLERY_EXTENDED_BENEFIT_SEARCH="<strong>Fatti trovare</strong>: eventi e immagini nella Smart Search di Joomla"
COM_EVENTGALLERY_EXTENDED_BENEFIT_NOLIMIT="<strong>Nessun limite</strong> di 30 immagini per gli album di Flickr e Google Photos"
