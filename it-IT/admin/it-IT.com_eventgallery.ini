COM_EVENTGALLERY_S3ACCOUNT="Account S3"
COM_EVENTGALLERY_S3ACCOUNTS_INTRO="Un account S3 indica a Event Gallery dove sono archiviate le tue immagini: su Amazon S3 o su qualsiasi servizio che offre l'API S3, come Cloudflare R2, Backblaze B2, Wasabi o Hetzner Object Storage. Puoi usare più account contemporaneamente e scegliere l'account quando crei un evento. I file originali restano privati; solo le miniature sono leggibili pubblicamente."
