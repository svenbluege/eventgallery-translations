COM_EVENTGALLERY_SYNC_START2_DESC="Questa pagina allinea il database ai file presenti nel tuo spazio di archiviazione.<br><br>Scegli gli eventi che vuoi aggiornare - quelli nuovi sono già selezionati - e premi <b>Avvia</b>. La pagina legge prima le cartelle e individua quali dei loro file il database non conosce, poi legge quei file e ne scrive i metadati. Mentre i file locali compaiono sempre, i file remoti vengono mostrati solo quando l'hash dell'originale è cambiato.<br><br>La seconda fase è quella onerosa, perciò c'è un secondo pulsante che si ferma dopo la prima: i tuoi eventi e i loro file risultano quindi aggiornati nel database, mancano solo le dimensioni delle immagini. Se usi Amazon S3 e hai una nuova cartella, puoi risparmiare banda creando le miniature prima di sincronizzarla: ogni sincronizzazione scarica per intero il file originale per poterlo misurare."
