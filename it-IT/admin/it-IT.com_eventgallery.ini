COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_CLOUDFLARE_R2="Sostituisci <ACCOUNT_ID> con l'ID del tuo account Cloudflare. R2 non serve mai file pubblici da questo endpoint: collega un dominio personalizzato (o l'indirizzo r2.dev) al bucket delle miniature e inseriscilo come URL pubblico delle miniature. R2 può rendere pubblico solo un intero bucket, quindi usa due bucket, mai uno solo."
