COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_DESC="Definisce se usare i dati di indirizzo salvati nel profilo dell'utente. Se impostato su No, l'utente deve sempre inserire il proprio indirizzo, anche se per il suo account ne esiste già uno salvato."
