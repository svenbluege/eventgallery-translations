PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT="Event Gallery - Report delle funzionalità"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_XML_DESCRIPTION="Questo plugin mostra le funzionalità di Event Gallery nel report delle funzionalità di Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_EXTENSION_NAME="Event Gallery"

PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_COOKIES="<b>Cookie:</b> Non vengono impostati cookie aggiuntivi. Per la gestione delle sessioni Event Gallery usa la gestione delle sessioni di Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_GOOGLEPHOTOS="<b>Google Photos:</b> <p>Se le immagini vengono fornite da Google Photos, gli utenti caricano contenuti dai server di Google.</p><p>Anche la gestione di Google Photos nel backend di Event Gallery richiama servizi di Google. I dati dei tuoi utenti del backend vengono usati per richiamare servizi come il selettore di album.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_FLICKR="<b>Flickr:</b> Se le immagini vengono fornite da Flickr, gli utenti caricano dati da un servizio esterno. Inoltre il tuo server comunica con i servizi di Flickr. Questa comunicazione non coinvolge i dati dei tuoi utenti."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_S3="<b>S3:</b> Se le immagini vengono fornite da Amazon S3, gli utenti caricano dati da un servizio esterno. Inoltre il tuo server comunica con il servizio Amazon S3. Questa comunicazione non coinvolge i dati dei tuoi utenti."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_CHECKOUT="<b>Checkout</b><p>Prima di poter creare un ordine, l'utente raccoglie gli articoli nel suo carrello. Durante il checkout il carrello viene completato con i dati dell'indirizzo. Dopo l'invio, l'ordine viene creato come copia del carrello. Oltre alle informazioni sugli articoli vengono salvati i dati dell'indirizzo del cliente. La quantità di dati dipende dalla configurazione del componente.</p><p>I dati dell'indirizzo sono presenti in tre punti: carrello, ordine e oggetto utente di Joomla!. Per il carrello e l'ordine questo non si può cambiare, ma nelle opzioni del componente puoi configurare che l'oggetto utente non venga usato per memorizzare dati.</p><p>Per alcuni metodi di pagamento vengono usati servizi esterni. Event Gallery non memorizza direttamente dati di pagamento. Viene invece usato un token generato per identificare la transazione creata dal fornitore di pagamento esterno.</p><p>Il backend di Event Gallery consente di svuotare i carrelli più vecchi di 30 giorni con un semplice clic su un link.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_STRIPE="<b>Pagamento // Stripe:</b> Per avviare un pagamento, Event Gallery invia a Stripe l'indirizzo email, il numero dell'ordine e l'importo. Durante il pagamento il cliente viene reindirizzato a una pagina ospitata da Stripe, dove Stripe può raccogliere dati dell'utente. Nel tuo sito web non viene caricato nulla di Stripe."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_PAYPAL="<b>Pagamento // PayPal:</b> Per creare una transazione PayPal, Event Gallery deve trasmettere a PayPal l'ID dell'ordine. Durante il pagamento il cliente viene reindirizzato a PayPal, che può così raccogliere dati dell'utente."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_SHARING="<b>Condivisione social:</b> Event Gallery usa solo opzioni di condivisione passive. Spetta all'utente del frontend attivare le opzioni di condivisione dei diversi servizi. Non sono presenti SDK JavaScript che trasmettono dati prima di un'interazione."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_YOUTUBE="<b>YouTube:</b> Per facilitare i primi passi e offrire aiuto, il backend incorpora alcuni video di YouTube."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_LOGS="<b>Log:</b> Event Gallery scrive alcuni file di log, che contengono l'indirizzo IP dell'utente del sito. Oltre che per le attività di elaborazione, ad esempio per Google Photos/Flickr/Amazon S3, scrive log per le transazioni di pagamento. Trovi questi file nella tua cartella dei log. Contengono dati degli utenti e vanno trattati con cura."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_MESSAGES="<b>Messaggi:</b> Gli utenti possono segnalare immagini o lasciare messaggi relativi alle immagini. Possono indicare un indirizzo email e un messaggio. Entrambi vengono salvati nel database."
