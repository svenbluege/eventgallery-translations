PLG_SYSTEM_PICASAUPDATER="Event Gallery - Mise à jour Google Photos et Flickr"
PLG_SYSTEM_PICASAUPDATER_XML_DESCRIPTION="Met à jour les albums Google Photos/Flickr vides lors des requêtes sur le site. Les albums contenant des images ne posent pas de problème, car ils sont actualisés automatiquement lorsqu'ils sont affichés. Les albums vides ne sont pas visibles sur le site et ne peuvent pas être actualisés automatiquement."
