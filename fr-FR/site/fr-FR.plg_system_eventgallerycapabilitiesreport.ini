PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT="Event Gallery - Rapport des capacités"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_XML_DESCRIPTION="Ce plugin affiche les capacités d'Event Gallery dans le rapport des capacités de Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_EXTENSION_NAME="Event Gallery"

PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_COOKIES="<b>Cookies :</b> Aucun cookie supplémentaire n'est défini. Pour la gestion des sessions, Event Gallery utilise celle de Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_GOOGLEPHOTOS="<b>Google Photos :</b> <p>La diffusion d'images depuis Google Photos amène les utilisateurs à charger du contenu depuis les serveurs de Google.</p><p>La gestion de Google Photos dans l'administration d'Event Gallery fait également appel aux services Google. Les données de vos utilisateurs de l'administration sont utilisées pour appeler ces services, comme le sélecteur d'albums.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_FLICKR="<b>Flickr :</b> La diffusion d'images depuis Flickr amène les utilisateurs à charger des données depuis un service externe. De plus, votre serveur communique avec les services Flickr. Cette communication n'implique aucune donnée de vos utilisateurs."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_S3="<b>S3</b> La diffusion d'images depuis Amazon S3 amène les utilisateurs à charger des données depuis un service externe. De plus, votre serveur communique avec le service Amazon S3. Cette communication n'implique aucune donnée de vos utilisateurs."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_CHECKOUT="<b>Commande</b><p>Avant de pouvoir passer une commande, l'utilisateur rassemble des articles dans son panier. Lors de la commande, ce panier est complété par les données d'adresse. Après validation, la commande est créée comme copie du panier. Outre les informations sur les articles, les données d'adresse du client sont enregistrées. La quantité de données dépend de la configuration du composant.</p><p>Les données d'adresse existent à trois endroits : le panier, la commande et l'objet utilisateur de Joomla!. Si cela ne peut pas être modifié pour le panier et la commande, vous pouvez configurer dans les options du composant que l'objet utilisateur ne soit pas utilisé pour stocker des données.</p><p>Pour certains modes de paiement, des services externes sont utilisés. Event Gallery ne stocke aucune donnée de paiement directe. Un jeton généré est utilisé à la place pour identifier la transaction créée par le prestataire de paiement externe.</p><p>L'administration d'Event Gallery permet de vider les paniers de plus de 30 jours d'un simple clic sur un lien.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_STRIPE="<b>Paiement // Stripe :</b> Pour initier un paiement, Event Gallery transmet à Stripe l'adresse e-mail, le numéro de commande et le montant. Le processus de paiement redirige votre client vers une page hébergée par Stripe, où Stripe peut collecter des données utilisateur. Rien de Stripe n'est chargé sur votre propre site."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_PAYPAL="<b>Paiement // PayPal :</b> Pour créer une transaction PayPal, Event Gallery doit transmettre l'ID de commande à PayPal. Le processus de paiement redirige votre client vers PayPal, qui peut ainsi collecter des données utilisateur."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_SHARING="<b>Partage social :</b> Event Gallery utilise uniquement des options de partage passives. C'est à l'utilisateur du site de déclencher les options de partage des différents services. Aucun SDK JavaScript ne transmet de données avant une interaction."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_YOUTUBE="<b>YouTube :</b> Pour faciliter la prise en main, l'administration intègre quelques vidéos YouTube."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_LOGS="<b>Journaux :</b> Event Gallery écrit des fichiers journaux. Ils contiennent l'adresse IP de l'utilisateur du site. En plus des tâches de traitement, par exemple pour Google Photos/Flickr/Amazon S3, il journalise les transactions de paiement. Vous trouverez ces fichiers dans votre dossier de journaux. Ils contiennent des données utilisateur et doivent être traités avec précaution."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_MESSAGES="<b>Messages :</b> Les utilisateurs peuvent signaler des images ou laisser des messages sur des images. Ils peuvent indiquer une adresse e-mail et un message. Les deux sont enregistrés dans la base de données."
