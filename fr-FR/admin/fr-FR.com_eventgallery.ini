COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_LABEL="Utiliser le cache"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_DESCRIPTION="Veuillez consulter le manuel pour ce paramètre. En bref : il active la mise en cache de certains éléments comme les requêtes SQL et les modules, même si le cache de Joomla! n'est pas activé."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_LABEL="Protéger les fichiers"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_DESCRIPTION="Si Oui, le système crée pour les fichiers locaux un fichier .htaccess qui empêche l'accès direct aux images téléversées. Si vous désactivez cette option, vous devez supprimer vous-même les fichiers .htaccess existants. N'oubliez pas le dossier racine des images. Si vous activez cette option, utilisez ensuite la synchronisation de la base de données, qui créera les fichiers .htaccess. Notez que cela ne fonctionne que sur les systèmes qui prennent en charge les fichiers .htaccess."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_LABEL="Miniatures précalculées pour les images locales"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_DESCRIPTION="Cette option bascule entre la génération dynamique des miniatures et la livraison de fichiers statiques. Vous pouvez précalculer les miniatures avec la fonction de synchronisation de la base de données. Sinon, aucune image ne s'affichera. Pour la plupart des serveurs, cette option peut rester désactivée."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FAILED="Event Gallery n'a pas pu mettre à jour la protection d'accès du dossier %s. Veuillez vérifier les droits des fichiers et supprimer ou restaurer manuellement les fichiers .htaccess et web.config de ce dossier. Sinon, vos miniatures risquent de ne pas être livrées correctement."

COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_LABEL="Groupe d'utilisateurs notifié"
COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_DESCRIPTION="Groupe d'utilisateurs qui reçoit un message lorsqu'une nouvelle commande arrive."
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_LABEL="Groupe d'utilisateurs par défaut"
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_DESCRIPTION="Définit le groupe auquel un utilisateur doit appartenir si l'événement n'indique rien d'autre."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_LABEL="Afficher les événements réservés à un groupe dans la liste"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_DESCRIPTION="Définit si les événements réservés à un groupe d'utilisateurs apparaissent dans les listes d'événements. Ils n'apparaissent toujours pas dans les modules. Affichez-les pour signaler aux utilisateurs qu'un contenu leur est accessible après connexion."

COM_EVENTGALLERY_OPTIONS_COMMON_LOAD_RESPONSIVE_ASSETS_LABEL="Charger le CSS responsive"
COM_EVENTGALLERY_OPTIONS_COMMON_LOAD_RESPONSIVE_ASSETS_DESCRIPTION="Cette option active le chargement d'un fichier CSS responsive très simple. Je recommande de la désactiver et d'ajouter vos propres styles adaptés aux points de rupture de votre template. La version statique est destinée aux pages qui limitent la largeur du contenu principal à une valeur fixe. La version fluide est utile si votre site utilise toute la largeur du navigateur."
