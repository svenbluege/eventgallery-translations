COM_EVENTGALLERY_SYNC_START2_DESC="Cette page met la base de données en accord avec les fichiers de votre stockage.<br><br>Choisissez les événements à mettre à jour - les nouveaux sont cochés pour vous - et cliquez sur <b>Démarrer</b>. La page lit d'abord les dossiers et détermine lesquels de leurs fichiers la base de données ne connaît pas, puis lit ces fichiers et enregistre leurs métadonnées. Les fichiers locaux apparaissent toujours, les fichiers distants seulement si le hash de l'original a changé.<br><br>La deuxième phase est la plus coûteuse ; un second bouton s'arrête donc après la première : vos événements et leurs fichiers sont alors à jour dans la base de données, seules les dimensions des images ne le sont pas. Si vous utilisez Amazon S3 et avez un nouveau dossier, vous pouvez économiser de la bande passante en créant les miniatures avant de le synchroniser : chaque synchronisation télécharge l'intégralité du fichier original pour le mesurer."
