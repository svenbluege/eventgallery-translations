COM_EVENTGALLERY_S3ACCOUNTS="Comptes S3"
COM_EVENTGALLERY_S3ACCOUNTS_INTRO="Un compte S3 indique à Event Gallery où sont stockées les images d'un événement : chez Amazon S3 ou chez un autre service S3 comme Cloudflare R2, Backblaze B2 ou Hetzner. Vous choisissez le compte lors de la création d'un événement. Les images que vous téléversez sur ce serveur n'ont besoin d'aucun compte."
