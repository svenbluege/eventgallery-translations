COM_EVENTGALLERY_EXTENDED_DESC="Le composant principal ne vous suffit pas ? Vous souhaitez soutenir le développement de ce composant ? Si vous recherchez des modules supplémentaires, des événements/images dans les articles, l'intégration à la recherche, des modes de paiement PayPal et d'autres avantages, pensez à passer à Event Gallery Extended."
