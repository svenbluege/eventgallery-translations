COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_NAME_DESC="Vous pouvez masquer le nom du fichier sur les pages de commande. C'est utile pour Google Photos et Flickr, qui utilisent des lettres et chiffres aléatoires peu utiles au client pour identifier une image."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_DISCLAIMER="Avertissement"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_DISCLAIMER_DESCRIPTION="Saisissez l'avertissement ici."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER="Avertissement de pied de page"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER_DESCRIPTION="Saisissez un avertissement ici. Il apparaîtra sur chaque page générée par ce composant si la fonction panier est active."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS="Adresse"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS_DESCRIPTION="Votre adresse de commerçant. Les e-mails envoyés à vos acheteurs se terminent par celle-ci, afin qu'ils sachent qui les a envoyés."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_MAIL_OPTIONS_LABEL="<strong>E-mails</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO="Logo"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO_DESCRIPTION="Le logo en haut des e-mails envoyés à vos acheteurs. Utilisez un fichier PNG ou JPG, de nombreux logiciels de messagerie n'affichent pas le SVG. Sans logo, le nom de votre site est affiché."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR="Couleur d'accent"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR_DESCRIPTION="La couleur des boutons et des liens dans les e-mails envoyés à vos acheteurs."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYSYMBOL="Symbole monétaire"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYSYMBOL_DESCRIPTION="Saisissez le symbole de la devise à utiliser. Peut être $ ou USD"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE="Code de devise"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE_DESCRIPTION="Saisissez le code de la devise à utiliser, par exemple USD ou EUR."

COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_LABEL="Protocole de rappel"
COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_DESC="Sur un hébergement mutualisé, les rappels (callbacks) en https peuvent poser problème. Utilisez cette option pour forcer le protocole des URL de rappel. Vérifiez que vos règles de réécriture ne perturbent pas ce réglage. L'option par défaut est conserver : elle utilise le protocole avec lequel le client a visité votre site."
COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_SECURE_LABEL="https"
