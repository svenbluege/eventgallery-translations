COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_DESCRIPTION="Si l'image est livrée au navigateur dans la même taille que le fichier téléversé, vous pouvez désactiver ici l'accentuation de la netteté. Par défaut, ce réglage concerne les images téléversées de moins de 1600px. Pour toutes les autres images, des miniatures plus petites sont livrées et ce réglage ne s'applique pas."
