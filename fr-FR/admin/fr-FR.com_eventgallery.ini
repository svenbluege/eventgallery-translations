COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_DESCRIPTION="Permet de signaler des images. Vous pouvez utiliser cette fonction pour recueillir les remarques de vos clients ou les réclamations de personnes qui souhaitent que leur image soit supprimée."

