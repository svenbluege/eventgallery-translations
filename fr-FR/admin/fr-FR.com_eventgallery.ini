COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_DESCRIPTION="Choisissez votre fournisseur de stockage pour remplir les champs ci-dessous avec des valeurs connues pour fonctionner. Vous pouvez modifier chaque valeur ensuite."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_CUSTOM="Autre service compatible S3"
COM_EVENTGALLERY_S3ACCOUNT_ENDPOINT_PLACEHOLDER_ERROR="Le point de terminaison n'est pas un nom d'hôte valide. Si vous avez choisi un fournisseur, remplacez les parties entre chevrons, comme <ACCOUNT_ID> ou <region>, par vos propres valeurs."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_AWS="Laissez le point de terminaison vide et saisissez la région de vos buckets. Les nouveaux buckets n'autorisent pas les ACL ; publiez donc les miniatures avec une politique de bucket."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_CLOUDFLARE_R2="Remplacez <ACCOUNT_ID> par l'identifiant de votre compte Cloudflare. R2 ne sert jamais de fichiers publics depuis ce point de terminaison : associez un domaine personnalisé (ou l'adresse r2.dev) au bucket des miniatures et saisissez-le comme URL publique des miniatures. R2 ne peut publier qu'un bucket entier ; utilisez donc deux buckets, jamais un seul."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_BACKBLAZE_B2="Saisissez la région de votre bucket, par exemple eu-central-003. B2 ne peut publier qu'un bucket entier : créez le bucket des miniatures en public et celui des originaux en privé, et utilisez deux buckets, jamais un seul."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_WASABI="Saisissez la région de vos buckets. Wasabi n'autorise pas l'accès public pour les nouveaux comptes tant que vous n'avez pas demandé à son support de l'activer."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_HETZNER="Saisissez l'emplacement de vos buckets comme région : fsn1, nbg1 ou hel1."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_IONOS="Saisissez la région de vos buckets, par exemple eu-central-3."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_DIGITALOCEAN="Saisissez la région de votre Space, par exemple fra1. Spaces publie les fichiers un par un via ACL ; l'option ACL est donc activée."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_SCALEWAY="Saisissez la région de vos buckets : fr-par, nl-ams ou pl-waw."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_OVH="Saisissez la région de vos buckets en minuscules, par exemple gra ou de."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_N0C="Votre site doit fonctionner chez PlanetHoster : N0C Storage ne répond qu'à leurs serveurs. Prenez la région (par exemple ht2-storage) et les clés dans Fichiers - N0C Storage de votre panneau N0C. Seul le dossier public du bucket est accessible depuis le web, les dossiers sont donc réglés pour lui : saisissez https://votre-domaine/n0c-storage comme URL publique des miniatures et téléversez vos images dans private/eventgallery/<dossier>."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_SELFHOSTED="Remplacez <YOUR_HOST> par l'adresse de votre service, avec le port s'il en a un. Les services auto-hébergés nécessitent généralement l'adressage par chemin et acceptent n'importe quelle région."
COM_EVENTGALLERY_S3ACCOUNT_PROVIDER_NOTE_CUSTOM="Reprenez le point de terminaison et la région de la documentation de votre fournisseur. Si la connexion échoue, essayez l'adressage par chemin."
COM_EVENTGALLERY_S3ACCOUNT_ENDPOINT="Point de terminaison"
COM_EVENTGALLERY_S3ACCOUNT_ENDPOINT_DESCRIPTION="Le nom d'hôte de l'API S3 de votre fournisseur, sans le nom du bucket, par exemple s3.eu-central-1.wasabisys.com. Laissez-le vide pour Amazon S3."
COM_EVENTGALLERY_S3ACCOUNT_REGION="Région"
COM_EVENTGALLERY_S3ACCOUNT_REGION_DESCRIPTION="La région de vos buckets, par exemple eu-central-1. Certains fournisseurs utilisent une valeur fixe comme auto ou us-east-1 ; consultez le manuel."
COM_EVENTGALLERY_S3ACCOUNT_PATHSTYLE="Adressage par chemin"
COM_EVENTGALLERY_S3ACCOUNT_PATHSTYLE_DESCRIPTION="Non : le bucket fait partie du nom d'hôte (https://bucket.endpoint/file). Oui : le bucket fait partie du chemin (https://endpoint/bucket/file). La plupart des fournisseurs hébergés fonctionnent avec Non ; les services auto-hébergés nécessitent généralement Oui."
COM_EVENTGALLERY_S3ACCOUNT_ACCESSKEY="Clé d'accès"
COM_EVENTGALLERY_S3ACCOUNT_ACCESSKEY_DESCRIPTION="L'identifiant de la clé d'accès que vous avez créée pour Event Gallery."
COM_EVENTGALLERY_S3ACCOUNT_SECRETKEY="Clé secrète"
COM_EVENTGALLERY_S3ACCOUNT_SECRETKEY_DESCRIPTION="Le secret associé à la clé d'accès."
