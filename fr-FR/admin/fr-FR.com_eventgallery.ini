COM_EVENTGALLERY_S3ACCOUNT="Compte S3"
COM_EVENTGALLERY_S3ACCOUNTS_INTRO="Un compte S3 indique à Event Gallery où vos images sont stockées : chez Amazon S3 ou chez tout service proposant l'API S3, comme Cloudflare R2, Backblaze B2, Wasabi ou Hetzner Object Storage. Vous pouvez utiliser plusieurs comptes en même temps et choisir le compte lors de la création d'un événement. Les fichiers originaux restent privés ; seules les miniatures sont lisibles publiquement."
