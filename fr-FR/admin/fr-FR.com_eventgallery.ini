COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_LABEL="E-mail"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_DESCRIPTION="Active le bouton de partage par e-mail."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_LABEL="Envoyer l'image par e-mail"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_DESCRIPTION="Active un bouton de partage qui envoie l'image elle-même, intégrée dans un e-mail, au lieu d'un lien. La taille d'image est la même que pour le téléchargement : l'image originale ou la plus grande miniature."
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_LABEL="Taille maximale d'image pour les e-mails (Mo)"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_DESCRIPTION="Les images plus grandes que cette taille sont envoyées sous forme de la plus grande miniature au lieu de l'image originale. Si la miniature est encore trop grande, le visiteur est invité à utiliser le téléchargement."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_LABEL="Télécharger les images"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_DESCRIPTION="Active le bouton de téléchargement des images."
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_LABEL="Partager les liens d'article"
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_DESCRIPTION="Si une image est affichée dans un article, vous pouvez configurer quel lien est partagé."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_LABEL="Bouton de téléchargement dédié"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_DESCRIPTION="Affiche le bouton de téléchargement à côté de l'icône de partage sur la miniature"
