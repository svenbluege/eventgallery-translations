COM_EVENTGALLERY_SYNC_INTRO="Met la base de données en accord avec les fichiers de votre stockage : nouveaux événements, images nouvelles et modifiées. Les nouveaux événements sont cochés pour vous."
COM_EVENTGALLERY_SYNC_HOW="Fonctionnement de la synchronisation"
COM_EVENTGALLERY_SYNC_HOW_SCAN="La <b>phase 1</b> lit les dossiers des événements cochés et trouve les fichiers que la base de données ne connaît pas encore. Les fichiers locaux apparaissent toujours ; les fichiers sur S3, Flickr ou Google Photos seulement si l'empreinte (hash) de l'original a changé."
COM_EVENTGALLERY_SYNC_HOW_FILES="La <b>phase 2</b> lit ces fichiers et écrit leurs métadonnées : taille, date, légende. C'est la plus coûteuse : pour S3, chaque original est entièrement téléchargé pour être mesuré. Sans elle, les images seraient listées, mais sans leurs dimensions, et le site ne pourrait pas les disposer."
COM_EVENTGALLERY_SYNC_HOW_S3="Un nouvel événement sur S3 n'a pas encore de miniatures : lancez le Générateur de miniatures après la synchronisation."
COM_EVENTGALLERY_SYNC_START_BUTTON="Synchroniser les événements et les images"
COM_EVENTGALLERY_THUMBNAILGENERATOR_INTRO="Crée les miniatures des événements S3 et locaux. Rien n'est coché pour vous : créer des miniatures prend du temps et coûte des requêtes S3."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW="Fonctionnement du Générateur de miniatures"
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_SCAN="La <b>phase 1</b> trouve les miniatures manquantes des événements cochés, la <b>phase 2</b> les crée. <i>Rechercher uniquement les miniatures manquantes</i> s'arrête après la phase 1 et marque en jaune chaque événement où des miniatures manquent ; le filtre <i>Miniatures manquantes</i> n'affiche que ces événements. À la fin, la page nomme ce qu'elle n'a pas pu faire."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_COST="Cela prend beaucoup de temps, et chaque miniature est une requête S3 que vous payez. Vous pouvez servir un même bucket depuis plusieurs sites, mais ne créez les miniatures que depuis l'un d'eux : la base de données conserve les empreintes (hash) des originaux et des miniatures, et là où elles manquent, les miniatures sont recréées."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_LOCAL="Pour les événements locaux, cette page est facultative : leurs miniatures sont créées lorsqu'un visiteur les demande pour la première fois."
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_BUTTON="Rechercher et créer les miniatures"
COM_EVENTGALLERY_THUMBNAILGENERATOR_REFRESHETAGS_LABEL="Conserver les miniatures déjà présentes dans le bucket"
