COM_EVENTGALLERY_OPTIONS_COMMON_USECART_DESCRIPTION="Définit si les boutons d'ajout au panier apparaissent."
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_LABEL="Afficher le panier du composant"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="Si vous utilisez un module pour afficher le panier, vous devez régler cette option sur Non. Sinon, le panier apparaît deux fois et des dysfonctionnements surviennent."
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_LABEL="Contrôles d'achat sur les images"
