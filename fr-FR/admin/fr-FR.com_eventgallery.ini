COM_EVENTGALLERY_S3ACCOUNT_HOWTO="Créez d'abord le ou les buckets et une clé d'accès chez votre fournisseur de stockage. La clé d'accès doit avoir le droit de lister les buckets et d'y lire, écrire et supprimer des objets. Le manuel décrit pas à pas la configuration pour chaque fournisseur pris en charge."
