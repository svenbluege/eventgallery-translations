COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LABEL="Utiliser les fichiers originaux"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_DESCRIPTION="Définit si les images originales, les fichiers basse résolution ou les deux sont utilisés pour le téléchargement et les réseaux sociaux. Les fichiers basse résolution peuvent contenir un filigrane."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LOWRES="Basse résolution"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_ORIGINAL="Fichiers originaux"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_BOTH="Les deux"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_LABEL="Accès aux fichiers originaux"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_DESCRIPTION="Le groupe d'utilisateurs sélectionné peut télécharger les fichiers originaux."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_OVERRIDE_DESCRIPTION="Le groupe d'utilisateurs sélectionné peut télécharger les fichiers originaux. Si seul Par défaut est sélectionné, les groupes d'utilisateurs de la configuration du composant sont utilisés. Sinon, les réglages de l'événement remplacent entièrement le groupe d'utilisateurs du composant."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_LABEL="URL de redirection"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_DESCRIPTION="Si le téléchargement n'est pas autorisé pour l'utilisateur actuel, il est redirigé vers cette URL. Vous pouvez indiquer ici l'URL de votre page d'abonnement."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_LABEL="Signalement d'images"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_DESCRIPTION="Permet de signaler des images. Vous pouvez utiliser cette fonction pour recueillir les remarques de vos clients ou les réclamations de personnes qui souhaitent que leur image soit supprimée."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_LABEL="Utiliser le rendu de secours"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_DESC="Utilise index.php comme solution de secours pour livrer les images. C'est lent et ne doit pas être une solution durable. Contactez votre hébergeur pour que les scripts PHP puissent être exécutés dans les dossiers des composants, au moins pour components/com_eventgallery/helpers/image.php et blank.php."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_LABEL="Accentuer la netteté"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_DESCRIPTION="Active ou désactive complètement l'accentuation de la netteté. Si elle est activée, la matrice définie ci-dessous est utilisée."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_LABEL="Netteté de l'original"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_DESCRIPTION="Si l'image est livrée au navigateur dans la même taille que le fichier téléversé, vous pouvez désactiver ici l'accentuation de la netteté. Par défaut, ce réglage concerne les images téléversées de moins de 1600px. Pour toutes les autres images, des miniatures plus petites sont livrées et ce réglage ne s'applique pas."
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_LABEL="Rotation automatique"
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_DESCRIPTION="Fait pivoter les images selon l'indicateur d'orientation contenu dans les informations EXIF de chaque image. N'oubliez pas de vider le cache et de synchroniser la base de données si vous modifiez cette option."
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_LABEL="Écraser avec les données IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_DESCRIPTION="Si Oui, la date de création, la légende et le titre d'une image dans la base de données sont écrasés par les données IPTC du fichier image. Sinon, les données IPTC servent uniquement à remplir les champs la première fois."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_LABEL="Utiliser les données IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_DESCRIPTION="Active ou désactive l'utilisation des données IPTC pour obtenir des informations comme la description et le titre de l'image."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_LABEL="Qualité d'image"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_DESC="La qualité de chaque image générée, de 40 à 95. La valeur par défaut, 85, est bonne ; des valeurs plus basses donnent des fichiers plus petits et une qualité inférieure."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_LABEL="Anti-cache"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_DESC="Les images sont mises en cache par les navigateurs et les visiteurs ne verraient pas vos modifications. La valeur de ce paramètre est ajoutée aux URL des images locales et S3. Cela force les navigateurs à recharger les images que vous avez modifiées."
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_LABEL="Matrice de netteté"
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_DESCRIPTION="Ne modifiez pas ce réglage si vous ne savez pas ce que vous faites ! La valeur par défaut est [[-1,-1,-1],[-1,16,-1],[-1,-1,-1]]. Permet de définir la netteté des images calculées. Si vous modifiez cette valeur, vous devez vider le cache de ce composant pour voir un résultat. Comment définir la matrice ? https://www.php.net/imageconvolution"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_LABEL="Afficher le nom du fichier"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_DESCRIPTION="Définit si le nom du fichier de l'image actuelle est affiché, pour que les clients potentiels puissent le noter."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_LABEL="Afficher le titre de l'image"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_DESCRIPTION="Affiche le titre de l'image."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_LABEL="Afficher la légende de l'image"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_DESCRIPTION="Affiche la description d'une image."
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_LABEL="Mélanger les images"
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_DESCRIPTION="Si Oui, les images d'un événement sont affichées dans un ordre aléatoire. Fonctionne uniquement sans pagination et ne concerne que le composant."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_LABEL="Utiliser le chargement différé"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_DESCRIPTION="Laissez cette option activée : le navigateur ne charge les miniatures situées sous la première rangée que lorsque le visiteur s'en approche en faisant défiler la page, ce qui garde une longue page rapide. Désactivez-la si vous voulez que toutes les images d'une page soient chargées d'un coup, par exemple pour une page que vous imprimez."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_LABEL="Filigranes sur les images principales"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_DESCRIPTION="Définit si les filigranes apparaissent sur les images principales (les images d'un événement marquées d'une étoile)."

