COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_TITLE_DESC="Affiche le titre de l'image dans le panier, la commande et les pages Mes commandes."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_LABEL="Afficher la légende de l'image"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_DESC="Affiche la légende de l'image dans le panier, la commande et les pages Mes commandes."
