COM_EVENTGALLERY_SECRET_STORED="Enregistré. Laissez le champ vide pour le conserver."
COM_EVENTGALLERY_S3ACCOUNT_FIELDSET_BUCKETS="Buckets"
COM_EVENTGALLERY_S3ACCOUNT_FIELDSET_BUCKETS_DESC="Où sont stockés les fichiers originaux et les miniatures, et comment les miniatures deviennent lisibles publiquement."
COM_EVENTGALLERY_S3ACCOUNT_BUCKETORIGINALS="Bucket des fichiers originaux"
COM_EVENTGALLERY_S3ACCOUNT_BUCKETORIGINALS_DESCRIPTION="Le bucket qui contient vos fichiers originaux. Il doit être privé : personne d'autre que ce compte ne doit pouvoir le lire."
COM_EVENTGALLERY_S3ACCOUNT_BUCKETRESIZED="Bucket des miniatures"
COM_EVENTGALLERY_S3ACCOUNT_BUCKETRESIZED_DESCRIPTION="Le bucket dans lequel Event Gallery écrit les miniatures. Ses fichiers doivent être lisibles publiquement. Laissez-le vide pour conserver originaux et miniatures dans un seul bucket."
COM_EVENTGALLERY_S3ACCOUNT_USEACL="Rendre les miniatures publiques par ACL"
COM_EVENTGALLERY_S3ACCOUNT_USEACL_DESCRIPTION="Oui : chaque miniature est téléversée avec la liste de contrôle d'accès public-read. Le bucket doit autoriser les ACL. Non : Event Gallery n'envoie pas d'ACL et la politique du bucket rend les miniatures lisibles. Choisissez Non pour les fournisseurs sans ACL comme Cloudflare R2 et Backblaze B2, ainsi que pour les buckets Amazon S3 avec le paramètre par défaut Bucket owner enforced."
COM_EVENTGALLERY_S3ACCOUNT_PUBLICBASEURL="URL publique des miniatures"
COM_EVENTGALLERY_S3ACCOUNT_PUBLICBASEURL_DESCRIPTION="Facultatif. L'adresse depuis laquelle vos visiteurs chargent les miniatures, si ce n'est pas le bucket lui-même : un CDN comme CloudFront, un domaine personnalisé ou l'URL publique du bucket chez des fournisseurs comme Cloudflare R2."
COM_EVENTGALLERY_S3ACCOUNT_ORIGINALSPREFIX="Dossier des originaux"
COM_EVENTGALLERY_S3ACCOUNT_ORIGINALSPREFIX_DESCRIPTION="Facultatif. Le dossier du bucket des originaux qui contient les dossiers de vos événements, par exemple private/eventgallery. Vide : originals lorsque les originaux et les miniatures partagent un bucket, sinon la racine du bucket. Le modifier ne déplace pas les fichiers déjà présents."
COM_EVENTGALLERY_S3ACCOUNT_THUMBNAILSPREFIX="Dossier des miniatures"
COM_EVENTGALLERY_S3ACCOUNT_THUMBNAILSPREFIX_DESCRIPTION="Facultatif. Le dossier du bucket des miniatures dans lequel Event Gallery les écrit, par exemple public/eventgallery. Vide : resized lorsque les originaux et les miniatures partagent un bucket, sinon la racine du bucket. Le modifier ne déplace pas les miniatures déjà présentes ; créez-les à nouveau."
COM_EVENTGALLERY_S3ACCOUNT_PUBLICBASEURLPREFIX="Dossier affiché par l'URL publique"
COM_EVENTGALLERY_S3ACCOUNT_PUBLICBASEURLPREFIX_DESCRIPTION="Facultatif. Seulement si l'URL publique ci-dessus affiche un dossier du bucket au lieu du bucket entier : le nom de ce dossier. N0C Storage, par exemple, affiche le dossier public sous https://votre-domaine/n0c-storage. Le dossier des miniatures doit se trouver à l'intérieur."
COM_EVENTGALLERY_S3ACCOUNT_PREFIX_INVALID_ERROR="%s : un dossier peut contenir des lettres, des chiffres et les caractères - _ . ! * ' ( ), avec / entre ses parties."
COM_EVENTGALLERY_S3ACCOUNT_PREFIX_OVERLAP_ERROR="Les originaux et les miniatures partagent un bucket : leurs dossiers doivent donc être différents, et aucun ne doit se trouver dans l'autre."
COM_EVENTGALLERY_S3ACCOUNT_PREFIX_PUBLIC_ERROR="Le dossier des miniatures doit se trouver dans le dossier affiché par l'URL publique, sinon vos visiteurs ne peuvent pas charger les miniatures."
COM_EVENTGALLERY_S3ACCOUNT_SERVICE="Service"
