COM_EVENTGALLERY_SUBMENU_THUMBNAILGENERATOR="Générateur de miniatures"
COM_EVENTGALLERY_THUMBNAILGENERATOR_START2_DESC="Cette page affiche vos événements S3 et locaux. Chaque image du bucket des originaux a besoin de ses miniatures.<br><br>Cochez les événements à traiter - rien n'est coché pour vous, car c'est coûteux - et cliquez sur <b>Démarrer</b>. La page cherche d'abord les miniatures manquantes puis les crée ; le second bouton se contente de chercher. À la fin, elle indique ce qu'elle n'a pas pu faire.<br><br><b>Cela prend beaucoup de temps</b>, et chaque miniature est une opération POST que vous payez. Vous pouvez servir un même bucket S3 depuis plusieurs sites, mais ne créez les miniatures que depuis l'un d'eux : la base de données contient les sommes de contrôle des originaux et des miniatures, et là où elles manquent, les miniatures sont recréées. Pour les événements locaux, cette page est facultative - leurs miniatures sont créées à la demande."
COM_EVENTGALLERY_THUMBNAILGENERATOR_GETMISSINGTHUMBNAILS="Rechercher les miniatures manquantes"
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_THUMBNAILCREATION="Créer les miniatures"
