COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_LABEL="Utiliser le formulaire de connexion"
COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_DESC="Vous pouvez afficher un formulaire de connexion sur la page d'adresse de la commande, pour permettre à l'utilisateur de se connecter et de lier sa commande à son compte."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_LABEL="Utiliser l'adresse de l'utilisateur"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_DESC="Définit si l'adresse enregistrée dans le compte utilisateur est utilisée. Si Non, l'utilisateur doit toujours saisir son adresse, même si une adresse est déjà enregistrée pour son compte."
COM_EVENTGALLERY_OPTIONS_COMMON_ENABLEBUSINESSCUSTOMERDATA_LABEL="Autoriser les clients professionnels"
