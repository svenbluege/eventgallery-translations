COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_LABEL="Afficher le panier du composant"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="Les pages d'Event Gallery affichent le panier sous forme de barre en bas de la fenêtre dès qu'il contient quelque chose. Tant que le module panier est visible sur une page, la barre s'efface, afin que le panier n'apparaisse qu'une fois. Désactivez cette option pour n'afficher le panier que dans le module. Conservez au moins l'un des deux : sans eux, l'ajout au panier ne fonctionne pas."
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_LABEL="Contrôles d'achat sur les images"
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_DESCRIPTION="Les contrôles qu'une image affiche en mode achat. Le bouton panier ouvre la fenêtre de choix du format pour cette image. La coche sélectionne l'image ; une barre en bas de la page ouvre alors une seule fenêtre de choix du format pour toute la sélection."
