PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT="Event Gallery - Poročilo o zmogljivostih"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_XML_DESCRIPTION="Ta vtičnik prikaže zmogljivosti Event Gallery v poročilu o zmogljivostih Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_EXTENSION_NAME="Event Gallery"

PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_COOKIES="<b>Piškotki:</b> Dodatni piškotki se ne nastavljajo. Za upravljanje sej Event Gallery uporablja upravljanje sej Joomla!."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_GOOGLEPHOTOS="<b>Google Photos:</b> <p>Prikaz slik iz Google Photos povzroči, da uporabniki nalagajo vsebino s strežnikov Googla.</p><p>Upravljanje Google Photos v skrbniškem vmesniku Event Gallery prav tako kliče storitve Googla. Podatki vaših skrbniških uporabnikov se uporabljajo za klic teh storitev, na primer izbirnika albumov.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_FLICKR="<b>Flickr:</b> Prikaz slik iz Flickr povzroči, da uporabniki nalagajo podatke iz zunanje storitve. Poleg tega vaš strežnik komunicira s storitvami Flickr. Pri tej komunikaciji se ne prenašajo podatki vaših uporabnikov."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_S3="<b>S3:</b> Prikaz slik iz Amazon S3 povzroči, da uporabniki nalagajo podatke iz zunanje storitve. Poleg tega vaš strežnik komunicira s storitvijo Amazon S3. Pri tej komunikaciji se ne prenašajo podatki vaših uporabnikov."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_CHECKOUT="<b>Blagajna</b><p>Preden lahko ustvari naročilo, uporabnik zbira izdelke v svoji košarici. Med nakupom se ta košarica dopolni s podatki o naslovu. Po oddaji se naročilo ustvari kot kopija košarice. Poleg podatkov o izdelkih se shranijo tudi podatki o naslovu stranke. Količina podatkov je odvisna od konfiguracije komponente.</p><p>Podatki o naslovu obstajajo na treh mestih: v košarici, v naročilu in v objektu uporabnika Joomla!. Čeprav tega ni mogoče spremeniti za košarico in naročilo, lahko v možnostih komponente nastavite, da se objekt uporabnika ne uporablja za shranjevanje podatkov.</p><p>Pri nekaterih plačilnih metodah se uporabljajo zunanje storitve. Event Gallery ne shranjuje neposrednih plačilnih podatkov. Namesto tega se uporablja ustvarjen žeton za identifikacijo transakcije, ki jo ustvari zunanji ponudnik plačil.</p><p>Skrbniški vmesnik Event Gallery omogoča izbris košaric, starejših od 30 dni, z enim klikom na povezavo.</p>"
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_STRIPE="<b>Plačilo // Stripe:</b> Za začetek plačila Event Gallery Stripu pošlje e-poštni naslov, številko naročila in znesek. Postopek plačila preusmeri vaše stranke na stran, ki jo gosti Stripe, kjer lahko Stripe zbira podatke o uporabniku. Nič iz Stripa se ne naloži na vaše lastno spletno mesto."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_PAYMENT_PAYPAL="<b>Plačilo // PayPal:</b> Za ustvarjanje transakcije PayPal mora Event Gallery PayPalu poslati ID naročila. Postopek plačila preusmeri vaše stranke na PayPal, ki lahko tako zbira podatke o uporabniku."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_SHARING="<b>Deljenje na družbenih omrežjih:</b> Event Gallery uporablja samo pasivne možnosti deljenja. Na uporabniku spletnega mesta je, da sproži možnosti deljenja različnih storitev. Ni JavaScript SDK-jev, ki bi prenašali podatke pred kakršno koli interakcijo."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_YOUTUBE="<b>YouTube:</b> Za lažji začetek in nekaj pomoči skrbniški vmesnik vključuje nekaj videoposnetkov YouTube."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_LOGS="<b>Dnevniki:</b> Event Gallery zapisuje nekatere dnevniške datoteke. Vsebujejo IP naslov uporabnika spletnega mesta. Poleg dnevnikov obdelovalnih opravil, na primer za Google Photos/Flickr/Amazon S3, zapisuje tudi dnevnike plačilnih transakcij. Te dnevniške datoteke najdete v mapi za dnevnike. Vsebujejo podatke uporabnikov in jih je treba obravnavati previdno."
PLG_SYSTEM_EVENTGALLERY_CAPABILITIES_REPORT_MESSAGES="<b>Sporočila:</b> Uporabniki lahko prijavijo slike ali pustijo sporočila o slikah. Lahko navedejo e-poštni naslov in sporočilo. Oboje se shrani v podatkovno bazo."
