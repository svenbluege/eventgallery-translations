COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_NEWSLETTER_OPTIN="Prijava na glasilo"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_NEWSLETTER_OPTIN_DESCRIPTION="Na strani blagajne prikaže možnost za naročilo na glasilo ali podobno."

