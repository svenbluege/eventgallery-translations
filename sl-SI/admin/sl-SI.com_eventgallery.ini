COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_LABEL="Pošlji sliko po e-pošti"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_EMAIL_IMAGE_DESCRIPTION="Vklopi gumb za deljenje, ki pošlje samo sliko vdelano v e-poštno sporočilo, namesto povezave. Uporablja isto velikost slike kot prenos: izvirno sliko ali največjo sličico."
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_LABEL="Največja velikost slike za e-pošto (MB)"
COM_EVENTGALLERY_OPTIONS_COMMON_SOCIAL_SHARING_EMAIL_IMAGE_MAX_SIZE_DESCRIPTION="Slike, večje od te velikosti, se pošljejo kot največja sličica namesto izvirne slike. Če je sličica še vedno prevelika, se obiskovalca prosi, naj uporabi prenos."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_LABEL="Prenos slik"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_DESCRIPTION="Vklopi gumb za prenos slik."
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_LABEL="Deli povezave do člankov"
COM_EVENTGALLERY_OPTIONS_COMMON_DO_SHARE_ARTICLE_LINKS_DESCRIPTION="Če je slika prikazana znotraj članka, lahko nastavite, katera povezava se deli."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_LABEL="Namenski gumb za prenos"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_DEDICATED_DOWNLOAD_BUTTON_DESCRIPTION="Prikaže gumb za prenos ob ikoni za deljenje na sličici"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_SOCIAL_SHARING_DOWNLOAD_SPACER_LABEL="<strong>Možnosti prenosa</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LABEL="Uporabi izvirne datoteke"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_DESCRIPTION="Določa, ali se za prenos in družbena omrežja uporabijo izvirne slike, datoteke nizke ločljivosti ali obe. Datoteke nizke ločljivosti lahko vsebujejo vodni žig."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_LOWRES="Nizka ločljivost"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_ORIGINAL="Izvirne datoteke"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_IMAGES_BOTH="Obe"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_LABEL="Dostop do izvirnih datotek"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_DESCRIPTION="Izbrana skupina uporabnikov lahko prenese izvirne datoteke."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_USERGROUP_OVERRIDE_DESCRIPTION="Izbrana skupina uporabnikov lahko prenese izvirne datoteke. Če je izbrana samo privzeta vrednost, se uporabijo skupine uporabnikov iz nastavitev komponente. Sicer nastavitve dogodka popolnoma nadomestijo nastavitev skupin uporabnikov komponente."
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_LABEL="URL za preusmeritev"
COM_EVENTGALLERY_OPTIONS_COMMON_DOWNLOAD_ORIGINAL_REDIRECT_DESCRIPTION="Če trenutni uporabnik ne sme prenesti datoteke, se preusmeri na ta URL. Tukaj lahko navedete URL svoje strani za naročnino."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_LABEL="Prijava slik"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IMAGE_REPORTING_DESCRIPTION="Omogoča ljudem, da prijavijo slike. To funkcijo lahko uporabite za zbiranje opomb ali pritožb svojih strank, če nekdo želi, da se njegova slika odstrani."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_LABEL="Uporabi alternativno upodabljanje"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LEGACY_IMAGE_RENDERING_DESC="Rezervna rešitev, ki za dostavo slik uporablja index.php. Je počasna in ne bi smela biti vaša dolgoročna rešitev. Obrnite se na ponudnika gostovanja, da zagotovite, da se skripte PHP lahko izvajajo v mapah komponent. Vsaj za components/com_eventgallery/helpers/image.php in blank.php bi to moralo delovati."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_LABEL="Uporabi ostrenje"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_DESCRIPTION="Splošno vklopi ali izklopi povečanje ostrine. Če je vklopljeno, uporabi spodnjo matriko."
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_LABEL="Uporabi ostrenje za izvirnik"
COM_EVENTGALLERY_OPTIONS_COMMON_USESHARPENING_FOR_ORIGINALSIZE_DESCRIPTION="Če je slika dostavljena brskalniku v isti velikosti kot naložena datoteka, lahko tukaj izklopite povečanje ostrine. Privzeto na to nastavitev vplivajo naložene slike, manjše od 1600 slikovnih pik. Za vse druge slike se dostavijo manjše sličice in ta nastavitev se ne uporablja."
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_LABEL="Uporabi samodejno vrtenje"
COM_EVENTGALLERY_OPTIONS_COMMON_USEAUTOROTATE_DESCRIPTION="Vrti slike na podlagi oznake za rotacijo, ki je del podatkov EXIF, shranjenih v vsaki sliki. Ne pozabite počistiti predpomnilnika in sinhronizirati podatkovne baze, če to možnost spremenite."
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_LABEL="Prepiši s podatki IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_OVERWRITE_WITH_IPTC_DATA_DESCRIPTION="Če je nastavljeno na Da, se polja datuma nastanka, napisa in naslova slike v podatkovni bazi prepišejo s podatki IPTC iz slikovne datoteke. Sicer se podatki IPTC uporabijo samo za začetno izpolnitev polj."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_LABEL="Uporabi podatke IPTC"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_IPTC_DATA_DESCRIPTION="S to možnostjo vklopite ali izklopite uporabo podatkov IPTC za pridobivanje podatkov, kot sta opis in naslov slike."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_LABEL="Kakovost slike"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_QUALITY_DESC="Kakovost vseh ustvarjenih slik, od 40 do 95. Privzeta vrednost 85 je dobra; nižje vrednosti dajo manjše datoteke in slabšo kakovost."
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_LABEL="Parameter proti predpomnjenju"
COM_EVENTGALLERY_OPTIONS_COMMON_THUMBNAIL_URL_BUST_DESC="Slike se predpomnijo v brskalnikih in ljudje ne bi videli vaših posodobitev. Vrednost tega parametra se doda URL-jem lokalnih slik in slik S3. To pomaga prisiliti brskalnike, da ponovno naložijo slike, če ste jih spremenili."
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_LABEL="Matrika ostrenja"
COM_EVENTGALLERY_OPTIONS_COMMON_SHARPINGMATRIX_DESCRIPTION="Tega ne spreminjajte, če ne veste, kaj počnete! Privzeto je [[-1,-1,-1],[-1,16,-1],[-1,-1,-1]]. Omogoča nastavitev ostrine izračunanih slik. Če spremenite to vrednost, morate počistiti predpomnilnik te komponente, da vidite rezultat. Kako nastaviti matriko? https://www.php.net/imageconvolution"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_LABEL="Prikaži ime datoteke"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGEFILENAME_DESCRIPTION="Določa, ali se prikaže ime datoteke trenutne slike, da jo potencialni kupci spoznajo."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_LABEL="Prikaži naslov slike"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGETITLE_DESCRIPTION="Prikaže naslov slike."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_LABEL="Prikaži napis slike"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWIMAGECAPTION_DESCRIPTION="Prikaže opis slike."
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_LABEL="Premešaj slike"
COM_EVENTGALLERY_OPTIONS_COMMON_SHUFFLEIMAGES_DESCRIPTION="Če je nastavljeno na Da, so slike dogodka prikazane v naključnem vrstnem redu. Deluje samo, če ni vklopljeno straničenje, in vpliva samo na komponento."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_LABEL="Uporabi leno nalaganje za slike"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_LAZYLOADING_FOR_IMAGES_DESCRIPTION="Pustite to možnost vklopljeno: brskalnik naloži sličice pod prvo vrstico šele, ko se jim obiskovalec približa med pomikanjem, kar ohranja hitrost dolge strani. Izklopite jo, če želite, da se vse slike na strani naložijo naenkrat, na primer na strani, ki jo boste natisnili."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_LABEL="Uporabi vodne žige na glavnih slikah"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_WATERMARK_FOR_MAINIMAGE_DESCRIPTION="Določa, ali se vodni žigi prikažejo na glavnih slikah (slike dogodka, označene z zvezdico)."

COM_EVENTGALLERY_OPTIONS_LAYOUT_EVENT="Dogodek - splošno"
COM_EVENTGALLERY_OPTIONS_LAYOUT_EVENT_DESC="Nastavite možnosti, ki se uporabljajo v vseh postavitvah dogodka"

