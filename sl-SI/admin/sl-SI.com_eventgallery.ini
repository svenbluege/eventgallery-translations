COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_PRESELECTED_COUNTRY_DESC="Določa državo, ki je privzeto izbrana na spustnem seznamu držav med blagajno. Tukaj vnesite dvočrkovno kodo države. Primer: DE, US, GB. Vnesete lahko samo eno vrednost."
COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_LABEL="Uporabi obrazec za prijavo"
COM_EVENTGALLERY_OPTIONS_COMMON_USELOGINFORM_DESC="Na strani naslova med blagajno lahko prikažete obrazec za prijavo, da se uporabniki lahko prijavijo in naročilo povežejo z njihovim računom."
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_LABEL="Uporabi podatke o naslovu uporabnika"
COM_EVENTGALLERY_OPTIONS_COMMON_USEADDRESSDATAFROMUSER_DESC="Določa, ali se uporabijo shranjeni podatki o naslovu uporabnika. Če je nastavljeno na Ne, mora uporabnik vedno vnesti svoj naslov, tudi če je naslov že shranjen na njegovem računu."
COM_EVENTGALLERY_OPTIONS_COMMON_ENABLEBUSINESSCUSTOMERDATA_LABEL="Dovoli poslovne stranke"
