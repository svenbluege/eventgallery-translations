COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_LABEL="Prikaži napis slike"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_CAPTION_DESC="Prikaže napis slike v košarici, na blagajni in na straneh mojih naročil."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_NAME_LABEL="Prikaži ime datoteke"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_USE_FILE_NAME_DESC="Ime datoteke lahko skrijete na straneh blagajne in naročil. To ima smisel za Google Photos in Flickr, ki uporabljata naključne znake in številke, ki stranki ne pomagajo pri prepoznavi slike."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_DISCLAIMER="Pravno obvestilo"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_DISCLAIMER_DESCRIPTION="Tukaj vnesite pravno obvestilo."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER="Pravno obvestilo v nogi"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_FOOTERDISCLAIMER_DESCRIPTION="Tukaj vnesite pravno obvestilo. Prikazalo se bo na vseh straneh, ki jih prikazuje ta komponenta, če je funkcija košarice aktivna."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS="Naslov"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MERCHANTADDRESS_DESCRIPTION="Vaš naslov trgovca. E-poštna sporočila, poslana vašim kupcem, se končajo z njim, da lahko vidijo, kdo jih je poslal."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_MAIL_OPTIONS_LABEL="<strong>E-pošta</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO="Logotip"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_LOGO_DESCRIPTION="Logotip na vrhu e-poštnih sporočil, poslanih vašim kupcem. Uporabite datoteko PNG ali JPG: številni e-poštni programi ne prikazujejo SVG. Brez logotipa se prikaže ime vaše spletne strani."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR="Poudarjena barva"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_MAIL_ACCENTCOLOR_DESCRIPTION="Barva gumbov in povezav v e-poštnih sporočilih, poslanih vašim kupcem."
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYSYMBOL="Simbol valute"
