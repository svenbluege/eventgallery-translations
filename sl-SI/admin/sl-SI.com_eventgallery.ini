COM_EVENTGALLERY_SYNC_INTRO="Uskladi podatkovno bazo z datotekami v vaši shrambi: novi dogodki ter nove ali spremenjene slike. Novi dogodki so že označeni."
COM_EVENTGALLERY_SYNC_HOW="Kako deluje sinhronizacija"
COM_EVENTGALLERY_SYNC_HOW_SCAN="<b>1. faza</b> prebere mape označenih dogodkov in najde datoteke, ki jih podatkovna baza še ne pozna. Lokalne datoteke so vedno prikazane; datoteke v S3, Flickr ali Google Photos pa samo, če se je zgoščena vrednost izvirnika spremenila."
COM_EVENTGALLERY_SYNC_HOW_FILES="<b>2. faza</b> prebere te datoteke in zapiše njihove metapodatke - velikost, datum, napis. Je najzahtevnejša: v S3 je vsak izvirnik v celoti prenesen, da se izmeri. Brez nje bi bile slike navedene, vendar brez dimenzij, in spletno mesto jih ne bi moglo razporediti."
COM_EVENTGALLERY_SYNC_HOW_S3="Nov dogodek v S3 še nima sličic: po sinhronizaciji zaženite generator sličic."
COM_EVENTGALLERY_SYNC_START_BUTTON="Sinhroniziraj dogodke in slike"
COM_EVENTGALLERY_THUMBNAILGENERATOR_INTRO="Ustvari sličice za dogodke S3 in lokalne dogodke. Nič ni označeno - ustvarjanje sličic porabi čas in zahteve S3."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW="Kako deluje generator sličic"
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_SCAN="<b>1. faza</b> najde manjkajoče sličice označenih dogodkov, <b>2. faza</b> jih ustvari. <i>Samo poišči manjkajoče sličice</i> se konča po 1. fazi in rumeno označi vsak dogodek, v katerem manjkajo sličice; filter <i>Manjkajoče sličice</i> prikaže samo te dogodke. Na koncu stran navede, česa ni zmogla."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_COST="Traja dolgo, vsaka sličica pa je zahteva S3, za katero morate plačati. Bucket lahko postrežete z več spletnih mest, vendar sličice ustvarjajte samo na enem od njih: podatkovna baza hrani zgoščene vrednosti izvirnikov in sličic, kjer manjkajo, pa se sličice ustvarijo znova."
COM_EVENTGALLERY_THUMBNAILGENERATOR_HOW_LOCAL="Za lokalne dogodke je ta stran izbirna - sličice se ustvarijo, ko jih obiskovalec prvič zahteva."
COM_EVENTGALLERY_THUMBNAILGENERATOR_START_BUTTON="Poišči in ustvari sličice"
