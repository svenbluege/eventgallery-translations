COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_LABEL="Uporabi predpomnjenje"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_CACHING_DESCRIPTION="Glejte priročnik o tem parametru. Na kratko: vklopi predpomnjenje nekaterih elementov, na primer SQL poizvedb in modulov, tudi če predpomnjenje Joomla! ni vklopljeno."

COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_LABEL="Zaščiti datoteke"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_HTACCESS_FILE_TO_PROTECT_ORIGINAL_FILES_DESCRIPTION="Če je nastavljeno na Da, sistem za lokalne datoteke ustvari datoteko .htaccess, ki prepreči neposreden dostop do naloženih slik. Če to nastavitev izklopite, boste morali obstoječe datoteke .htaccess odstraniti ročno. Ne pozabite na korensko mapo slik. Če to možnost vklopite, nato uporabite funkcijo Sinhroniziraj podatkovno bazo, ki bo ustvarila datoteke .htaccess. Upoštevajte, da to deluje samo na sistemih, ki podpirajo datoteke .htaccess."
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_LABEL="Uporabi vnaprej izračunane sličice za lokalne slike"
COM_EVENTGALLERY_OPTIONS_COMMON_USE_PRECALCULATED_THUMBNAILS_FOR_LOCAL_IMAGES_DESCRIPTION="Ne (privzeto): Event Gallery vsako sličico lokalne slike dostavi sam (image.php) in najprej preveri, ali obiskovalec sliko sme videti. Da: sličice so datoteke, ki jih dostavlja spletni strežnik - hitreje, vendar brez preverjanja: kdor ima naslov sličice, jo dobi, tudi pri dogodku z geslom ali za uporabniške skupine. Sličice ustvarite z Generatorjem sličic, sicer vaša stran ne prikaže nobene slike. Event Gallery zapisuje in odstranjuje datoteki .htaccess in web.config v mapi images/eventgallery_generated skladno s to možnostjo. Delujeta samo na spletnem strežniku, ki ju bere (Apache, LiteSpeed, IIS); na nginx dostop do mape prepovejte v konfiguraciji strežnika."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FAILED="Event Gallery ni mogel posodobiti zaščite dostopa za mapo %s. Preverite dovoljenja datotek in ročno izbrišite ali obnovite datoteke .htaccess in web.config v tej mapi. Sicer sličice morda ne bodo pravilno dostavljene."
COM_EVENTGALLERY_IMAGE_CACHE_PROTECTION_FOREIGN="V mapi %2$s je datoteka, ki je Event Gallery ni zapisal: %1$s. Event Gallery jo pusti takšno, kot je. Preverite, ali ustreza možnosti “Uporabi vnaprej izračunane sličice za lokalne slike”: če je možnost izklopljena, spletni strežnik sličic iz te mape ne sme dostavljati, če je vklopljena, jih mora. Če datoteko izbrišete, Event Gallery zapiše svojo tam, kjer je potrebna."

COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_LABEL="Skupina uporabnikov za obveščanje"
COM_EVENTGALLERY_OPTIONS_COMMON_ADMINUSERGROUP_DESCRIPTION="Skupina uporabnikov, ki prejme sporočilo, ko prispe novo naročilo."
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_LABEL="Privzeta skupina uporabnikov"
COM_EVENTGALLERY_OPTIONS_COMMON_DEFAULTUSERGROUP_DESCRIPTION="Določa skupino uporabnikov, ki mora pripadati uporabnik, če dogodek ne določi drugače."
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_LABEL="Na seznamu prikaži dogodke, specifične za skupine uporabnikov"
COM_EVENTGALLERY_OPTIONS_COMMON_SHOWUSERGROUPSPECIFICEVENTSINLIST_DESCRIPTION="Določa, ali naj se na seznamih dogodkov prikažejo dogodki, specifični za skupine uporabnikov. V modulih še vedno ne bodo prikazani. Prikažite jih, da bodo uporabniki vedeli, da obstajajo vsebine, za katere se morajo prijaviti."

COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_SPACER_ADDRESS_OPTIONS_LABEL="<strong>Naslovi</strong>"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_LABEL="Uporabi košarico"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_DESCRIPTION="Določa, ali so prikazani gumbi za dodajanje v košarico."
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_LABEL="Prikaži košarico komponente"
COM_EVENTGALLERY_OPTIONS_COMMON_USECART_INSIDE_COMPONENT_DESCRIPTION="Strani Event Gallery prikazujejo košarico kot vrstico na dnu okna, dokler je v njej kakšen element. Medtem ko je modul košarice vidna na strani, se vrstica umakne, tako da se košarica prikaže samo enkrat. Izklopite to možnost, če želite košarico prikazati samo v modulu. Vsaj eno od obeh ohranite: brez nobene ni mogoče dodajati v košarico."
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_LABEL="Nadzori nakupa na slikah"
COM_EVENTGALLERY_OPTIONS_COMMON_BUY_CONTROLS_DESCRIPTION="Nadzori, ki jih slika prikaže v načinu nakupa. Gumb košarice odpre pogovorno okno formatov te slike. Potrditveno polje izbere sliko; vrstica na dnu strani nato odpre eno samo pogovorno okno formatov za celotno izbiro."
