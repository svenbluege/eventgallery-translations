COM_EVENTGALLERY_SHIPPINGMETHODS_HELP_TITLE="Kako delujejo načini dostave"
COM_EVENTGALLERY_SHIPPINGMETHODS_HELP_1="Ponudnik določi, kaj način dostavi: Standard Ground pošilja odtise, Download in Email dostavita prenose, Mixed pa ustreza košaricam, ki jih izberete v svojem obrazcu."
