COM_EVENTGALLERY_PAYMENTMETHODS_HELP_1="Ponudnik določi, kako način prejme denar. Standard je namenjen plačilom zunaj trgovine – plačilo z gotovino ob prevzemu, bančno nakazilo, plačilo po povzetju – in deluje takoj. PayPal Checkout in Stripe zahtevata račun pri teh storitvah; njune ključe vnesete v obrazec načina."
COM_EVENTGALLERY_PAYMENTMETHODS_HELP_2="Način je ponujen samo za košarice, za katere je primeren: košarice z odtisi, s prenosi ali z obojim. Značke pod imenom kažejo, katere."
