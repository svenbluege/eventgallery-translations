COM_EVENTGALLERY_EXTENDED_TITLE="Event Gallery Extended"
COM_EVENTGALLERY_EXTENDED_DESC="Vam glavna komponenta ne zadostuje? Bi radi podprli razvoj te komponente? Če iščete dodatne module, dogodke/slike v člankih, integracijo z iskanjem, plačilne metode PayPal in druge dodatke, razmislite o nadgradnji na Event Gallery Extended."
