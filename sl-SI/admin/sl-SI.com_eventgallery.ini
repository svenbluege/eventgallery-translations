COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE="Koda valute"
COM_EVENTGALLERY_OPTIONS_COMMON_CHECKOUT_CURRENCYCODE_DESCRIPTION="Vnesite kodo valute, ki jo želite uporabljati. Mora biti nekaj kot USD ali EUR."

COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_LABEL="Protokol povratnega klica"
COM_EVENTGALLERY_OPTIONS_CHECKOUT_INCOMING_PROTOCOL_DESC="Če je vaša spletna stran na deljenem gostovanju, lahko pride do težav s povratnimi klici prek https. Uporabite to nastavitev za vsiljevanje protokola URL-jev povratnih klicev. Poskrbite, da vaša pravila za prepisovanje tega ne motijo. Privzeta možnost je ohrani, ki uporabi protokol, s katerim je stranka obiskala vašo spletno stran."
